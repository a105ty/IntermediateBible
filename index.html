<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Intermediate Bible</title>

<!-- Bisa dipasang ke layar utama (PWA). Manifest ditanam sebagai data URI
     supaya berkas ini tetap satu berkas tunggal — tidak perlu file
     manifest.json terpisah. Ikonnya SVG agar tidak perlu berkas gambar.
     Catatan: pemasangan PWA hanya ditawarkan peramban bila halaman ini
     dibuka lewat https:// (atau localhost), bukan file://. -->
<meta name="theme-color" content="#8A6D1F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Intermediate Bible">
<meta name="description" content="Pembaca Alkitab banding-terjemahan dengan bahasa asli Ibrani/Yunani, catatan, dan mode offline.">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/a105ty/IntermediateBible/main/icon-256.png">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%238A6D1F'/%3E%3Cpath d='M18 14h20a8 8 0 018 8v28H26a8 8 0 00-8 8z' fill='none' stroke='%23FBF9F4' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M32 20v22' stroke='%23FBF9F4' stroke-width='3'/%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Intermediate Bible","short_name":"Bible","start_url":".","display":"standalone","background_color":"%23FBF9F4","theme_color":"%238A6D1F","lang":"id","icons":[{"src":"data:image/svg%2Bxml,%253Csvg xmlns=%2527http://www.w3.org/2000/svg%2527 viewBox=%25270 0 64 64%2527%253E%253Crect width=%252764%2527 height=%252764%2527 rx=%252712%2527 fill=%2527%25238A6D1F%2527/%253E%253C/svg%253E","sizes":"any","type":"image/svg+xml","purpose":"any"}]}'>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#FBF9F4; --panel:#FFFFFF; --panel2:#F4F0E7; --line:#E2DBCC;
  --ink:#221E18; --ink2:#6E655A; --accent:#8A6D1F; --accentSoft:#F2EAD4;
  --hl-kuning:#FCE7A2; --hl-hijau:#BFE3C9; --hl-biru:#BCD8EC; --hl-merah:#F2C4C0; --hl-ungu:#DDCBEC;
  --font-size:18px; --line-height:1.85;
  --body-font:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
html[data-theme="dark"]{
  --bg:#12100E; --panel:#1B1815; --panel2:#232019; --line:#332E27;
  --ink:#EDE6DA; --ink2:#A79C8C; --accent:#C8A24A; --accentSoft:#3A3220;
  --hl-kuning:#6B5A1E; --hl-hijau:#2C5138; --hl-biru:#274A5E; --hl-merah:#63302C; --hl-ungu:#43305C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif}
button,select,input,textarea{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,
[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--panel);
  border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 0 0}
.tbrow{display:flex;align-items:center;gap:8px;padding:9px 14px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.02em;font-size:15px;color:var(--accent);margin-right:4px}
.refbtn{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--ink);font-size:13px;font-weight:600}
.icobtn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel2);color:var(--ink2);cursor:pointer;flex-shrink:0;font-size:14px}
.icobtn.on{background:var(--accentSoft);color:var(--accent);border-color:var(--accent)}
.spacer{flex:1}
.savestate{font-size:11px;color:var(--ink2);white-space:nowrap}
.savestate.err{color:#C0554A}

/* version rail */
.vrail{display:flex;gap:6px;padding:0 14px 9px;overflow-x:auto}
.vrail::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:20px;
  border:1px solid var(--line);background:var(--panel2);color:var(--ink2);cursor:pointer;
  font-size:12px;white-space:nowrap;flex:none}
.pill.on{background:var(--accentSoft);color:var(--accent);border-color:var(--accent);font-weight:600}
.pill .x{opacity:.6;font-size:13px;line-height:1}

/* ---------- layout ---------- */
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 90px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
h1.title{margin:0;font-family:var(--body-font);font-size:32px;font-weight:400;letter-spacing:-.01em}
h1.title span{color:var(--ink2)}
.intro{margin:8px 0 22px;font-size:12.5px;line-height:1.6;color:var(--ink2)}

/* ---------- verse rows (sejajar antar versi) ---------- */
.vrow{display:grid;gap:0 14px;border-radius:8px;padding:2px 0;margin-bottom:2px;
  align-items:start;transition:background 140ms ease}
.vrow:hover{background:var(--panel2)}
.vrow.sel{background:var(--accentSoft);box-shadow:inset 0 0 0 1px var(--accent)}
/* stabilo = isi warna */
.vrow.stab{background:var(--stab)}
/* catatan berwarna = outline putus-putus + isi warna tipis, memakai warna
   catatan itu sendiri. Putus-putus supaya jelas beda dari sorot. */
.vrow.ncol{background:var(--nc-bg);border:2px dashed var(--nc);border-radius:8px}
/* sorot = outline tegas + isi warna tipis (transparan), beda dari stabilo.
   Dipakai `border` (bukan box-shadow) supaya ayat bersebelahan berwarna
   sama bisa "menyatu" — lihat mjoin-top/mjoin-bottom di bawah. */
.vrow.mark{background:var(--mark-bg);border:2px solid var(--mark);border-radius:8px}
.vrow.mark.mjoin-top{border-top-width:0;border-top-left-radius:0;border-top-right-radius:0}
.vrow.mark.mjoin-bottom{margin-bottom:0;border-bottom-width:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.vrow.mark.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.vcell{padding:7px 9px;cursor:pointer;min-width:0}
.vcell p{margin:0;font-family:var(--body-font);font-size:var(--font-size);line-height:var(--line-height);
  overflow-wrap:break-word}
.vcell.zh p{font-family:"Songti SC","SimSun","Noto Serif SC",serif;line-height:calc(var(--line-height) + .15)}
.vnum{color:var(--accent);font-weight:700;font-size:.62em;margin-right:6px;
  font-family:"Inter",sans-serif;vertical-align:super;user-select:none}
.vmark{font-size:11px;margin-left:6px;color:var(--accent);cursor:pointer}
.vmark.tinted{padding:1px 6px;border-radius:20px;border:1.5px solid currentColor;font-weight:700}
.miss{color:var(--ink2);font-style:italic;font-size:13px;font-family:"Inter",sans-serif}

/* kolom judul versi — ikut lebar grid */
.vhead{display:grid;gap:0 14px;position:sticky;top:0;z-index:5;
  background:var(--bg);padding:6px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.vhcell{padding:0 9px;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px;min-width:0}
.vhcell span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swapb{border:none;background:none;color:var(--ink2);cursor:pointer;font-size:12px;padding:2px;flex:none}
.swapb:hover{color:var(--accent)}

/* ---------- interlinear di bawah ayat ---------- */
.inter{display:flex;flex-wrap:wrap;gap:5px;margin:6px 9px 12px;padding-top:10px;
  border-top:1px dashed var(--line)}
.inter.rtl{flex-direction:row-reverse;justify-content:flex-end}
.iw{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 9px;
  cursor:pointer;text-align:center;min-width:64px;display:flex;flex-direction:column;gap:2px}
.iw:hover{border-color:var(--accent)}
.iw .o{font-size:18px;color:var(--ink);font-family:"Times New Roman","SBL Hebrew","SBL Greek",serif;line-height:1.5}
.iw .tr{font-size:9.5px;color:var(--ink2);font-style:italic}
.iw .gl{font-size:10.5px;color:var(--ink);line-height:1.35}
.iw .gl.zh{font-family:"Songti SC","SimSun","Noto Serif SC",serif;font-size:12px}
.iw .gl.dim{color:var(--ink2);font-size:9.5px}
.iw .st{font-size:8.5px;color:var(--accent);font-weight:700}
.ilnote{font-size:11px;color:var(--ink2);margin:0 9px 14px;line-height:1.5}
.bigword{font-size:24px;color:var(--ink);line-height:1.6;margin:2px 0 2px;
  font-family:"Times New Roman","SBL Hebrew","SBL Greek",serif}

/* ---------- tools ---------- */
.tools{position:sticky;bottom:60px;margin-top:20px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:14px;box-shadow:0 -6px 24px rgba(0,0,0,.07);z-index:20}
html[data-theme="dark"] .tools{box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.toolhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.toolref{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tlabel{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink2);margin:10px 0 6px}
.swrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:1px solid var(--line)}
.swatch.on{border:2px solid var(--accent);transform:scale(1.1)}
.swatch.ring{background:transparent!important}
.swatch.none{background:transparent;border-style:dashed;display:flex;align-items:center;
  justify-content:center;color:var(--ink2);font-size:13px}
textarea.note{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:13px;resize:vertical;outline:none;min-height:74px}
.trow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{padding:9px 15px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);
  color:var(--bg);font-size:12.5px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:600}
.btn.warn{background:transparent;color:#C0554A;border-color:#C0554A}

/* ---------- overlay ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.42);display:none;
  align-items:flex-start;justify-content:center;padding:5vh 14px 14px;overflow-y:auto}
.ov.on{display:flex}
.ovbox{background:var(--panel);border-radius:14px;border:1px solid var(--line);width:100%;
  max-width:580px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ovhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.ovtitle{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.srch{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:14.5px;outline:none;margin-bottom:12px}
.res{display:flex;gap:10px;align-items:center;width:100%;text-align:left;cursor:pointer;background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:7px;color:var(--ink)}
.res.on{border-color:var(--accent);background:var(--accentSoft)}
.res .t{flex:1;min-width:0}
.res .t b{display:block;font-size:13px;font-weight:600}
.res .t i{display:block;font-size:11px;color:var(--ink2);font-style:normal;margin-top:2px}
.tag{font-size:9.5px;border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--ink2);flex:none}
.tag.full{color:var(--accent);border-color:var(--accent)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chapbtn{min-width:38px;padding:8px 6px;justify-content:center;font-weight:600;color:var(--ink);
  border:1px solid var(--line);background:var(--panel2);border-radius:7px;cursor:pointer;font-size:12.5px}
.chapbtn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.grid-b{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.grid-c{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.fld{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink2);margin:12px 0 5px}
.inp{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:13.5px;outline:none}
.hint{font-size:11.5px;color:var(--ink2);line-height:1.6;margin:8px 0 0}
.sechead{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink2);margin:16px 0 8px}
.sechead:first-child{margin-top:0}
.vrow.pinned{position:relative}
.pinbadge{position:absolute;top:2px;right:4px;font-size:12px;line-height:1;z-index:2;
  pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.vcell{position:relative;-webkit-user-select:none;user-select:none}
.chk{width:22px;height:22px;border-radius:6px;flex:none;cursor:pointer;border:1.5px solid var(--line);
  background:transparent;display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:13px;font-weight:900}
.chk.on{border-color:var(--accent);background:var(--accent);color:var(--bg)}
.diag{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:12px;line-height:1.5}
.diag b{flex:none;width:18px}
.diag .d{flex:1;color:var(--ink2)}
.diag.ok b{color:#3E8E5A}.diag.bad b{color:#C0554A}.diag.wait b{color:var(--ink2)}
.skel{height:1.05em;background:var(--line);border-radius:4px;opacity:.4;margin:10px 9px;animation:p 1.3s ease-in-out infinite}
.skel:nth-child(2n){width:86%}.skel:nth-child(3n){width:72%}
@keyframes p{50%{opacity:.15}}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);
  border-top:1px solid var(--line);display:flex;gap:8px;
  padding:8px 14px calc(8px + env(safe-area-inset-bottom))}
.foot button{flex:1;padding:10px 0;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer}
.foot button:disabled{opacity:.35}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;
  font-size:12.5px;max-width:82vw;text-align:center}

/* ---------- lampiran catatan: foto & audio ---------- */
.mgrid{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.mthumb{position:relative;width:78px;height:78px;border-radius:8px;overflow:hidden;
  border:1px solid var(--line);background:var(--panel2);flex:none}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.mdel{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;
  border:none;background:rgba(0,0,0,.62);color:#fff;font-size:12px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.arow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:8px 9px;margin-bottom:6px}
.arow audio{flex:1;min-width:0;height:32px}
.arow .adel{border:none;background:none;color:#C0554A;cursor:pointer;font-size:14px;flex:none;padding:2px 4px}
.rec{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.recdot{width:10px;height:10px;border-radius:50%;background:#C0554A;flex:none;
  animation:rp 1s ease-in-out infinite}
@keyframes rp{50%{opacity:.25}}
.mbadge{font-size:11px;margin-left:5px;color:var(--ink2)}

/* baris daftar catatan: area teks bisa diketuk + tombol aksi di kanan.
   div.res dipakai (bukan button) karena tombol tidak boleh bersarang. */
.res.rowbox{cursor:default}
.res .t.tap{cursor:pointer}
.res .acts{display:flex;gap:4px;flex:none}

/* kilatan singkat saat pindah ke sebuah ayat lewat pencarian/catatan */
@keyframes flash{0%,100%{box-shadow:inset 0 0 0 0 rgba(0,0,0,0)}
  35%{box-shadow:inset 0 0 0 3px var(--accent)}}
.vrow.flash{animation:flash 1.1s ease-out 1}
</style>
</head>
<body>

<div class="topbar">
  <div class="tbrow">
    <span class="brand">Intermediate Bible</span>
    <button class="refbtn" id="refBtn">📖 <span id="refT">Kejadian 1</span></button>
    <button class="icobtn" id="ilBtn" title="Bahasa asli di bawah ayat">א</button>
    <button class="icobtn" id="paletteBtn" title="Tandai ayat — buka untuk mulai menyorot, tutup untuk mengunci">🎨</button>
    <span class="savestate" id="sync"></span>
    <button class="icobtn" id="planBtn" title="Renungan harian">📅</button>
    <a href="https://docs.google.com/document/d/1So6iWR1nc3RzWp5jxjNpBb4i4IC1WB1M1uHkDWINCC4/edit?usp=drivesdk" target="_blank" class="icobtn" title="Buka Silabus di Google Docs"> 🎓</a>
    <button class="icobtn" id="findBtn" title="Cari ayat">🔍</button>
    <button class="icobtn" id="dlBtn" title="Unduhan offline">⬇</button>
    <button class="icobtn" id="listBtn" title="Catatan tersimpan">📑</button>
    <button class="icobtn" id="setPin" title="Pinbadge">📌</button>
    <button class="icobtn" id="accBtn" title="Akun &amp; sinkronisasi">👤</button>
    <button class="icobtn" id="setBtn" title="Pengaturan">⚙</button>
    <button class="icobtn" id="tutBtn" title="Tutorial — cara pakai">ⓘ</button>
  </div>
  <div class="swrow" id="swatchRow" style="display:none;padding:0 14px 9px"></div>
  <div class="vrail" id="vrail"></div>
</div>

<div class="wrap">
  <div class="eyebrow" id="eyeb">Perjanjian Lama</div>
  <h1 class="title" id="title">Kejadian <span>1</span></h1>
  <p class="intro" id="intro"></p>
  <div id="reader"></div>
  <div class="tools" id="tools" style="display:none"></div>
</div>

<div class="foot">
  <button id="prev">‹ Sebelumnya</button>
  <button id="next">Berikutnya ›</button>
</div>

<div class="ov" id="ov"><div class="ovbox" id="ovbox"></div></div>
<script>
const BOOKS=[
  {id:"kej",name:"Kejadian",en:"Genesis",zh:"创世记",t:"PL",ch:50,usfm:"GEN",src:"Gen"},
  {id:"kel",name:"Keluaran",en:"Exodus",zh:"出埃及记",t:"PL",ch:40,usfm:"EXO",src:"Exod"},
  {id:"ima",name:"Imamat",en:"Leviticus",zh:"利未记",t:"PL",ch:27,usfm:"LEV",src:"Lev"},
  {id:"bil",name:"Bilangan",en:"Numbers",zh:"民数记",t:"PL",ch:36,usfm:"NUM",src:"Num"},
  {id:"ula",name:"Ulangan",en:"Deuteronomy",zh:"申命记",t:"PL",ch:34,usfm:"DEU",src:"Deut"},
  {id:"yos",name:"Yosua",en:"Joshua",zh:"约书亚记",t:"PL",ch:24,usfm:"JOS",src:"Josh"},
  {id:"hak",name:"Hakim-hakim",en:"Judges",zh:"士师记",t:"PL",ch:21,usfm:"JDG",src:"Judg"},
  {id:"rut",name:"Rut",en:"Ruth",zh:"路得记",t:"PL",ch:4,usfm:"RUT",src:"Ruth"},
  {id:"1sa",name:"1 Samuel",en:"1 Samuel",zh:"撒母耳记上",t:"PL",ch:31,usfm:"1SA",src:"1Sam"},
  {id:"2sa",name:"2 Samuel",en:"2 Samuel",zh:"撒母耳记下",t:"PL",ch:24,usfm:"2SA",src:"2Sam"},
  {id:"1ra",name:"1 Raja-raja",en:"1 Kings",zh:"列王纪上",t:"PL",ch:22,usfm:"1KI",src:"1Kgs"},
  {id:"2ra",name:"2 Raja-raja",en:"2 Kings",zh:"列王纪下",t:"PL",ch:25,usfm:"2KI",src:"2Kgs"},
  {id:"1ta",name:"1 Tawarikh",en:"1 Chronicles",zh:"历代志上",t:"PL",ch:29,usfm:"1CH",src:"1Chr"},

  H1732:["Daud","大卫"],
  H6726:["Sion","锡安"],

};

function fullDef(e){
  if(!e) return "";
  return (e.strongs_def || e.kjv_def || "").replace(/\s+/g," ").trim();
}
function enGloss(e){
  if(!e) return "";
  let d = (e.strongs_def || "").replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim();
  if(!d) d = (e.kjv_def || "").replace(/\s+/g," ").trim();
  d = d.replace(/^[-\u2013\s"]+/,"");
  const cut = d.split(/[;]/)[0].trim();
  return cut.length > 30 ? cut.slice(0,28) + "\u2026" : cut;
}
function gloss(dict, sn){
  if(!sn) return {en:"", id:"", zh:"", tr:""};
  const e = dict ? dict[sn] : null;
  const pair = GLOSS_MAP[sn] || ["",""];
  return {
    en: enGloss(e),
    id: pair[0] || "",
    zh: pair[1] || "",
    tr: e ? (e.translit || e.xlit || "") : ""
  };
}
/* Susun baris arti sesuai pilihan pengguna.
   Mode "mix" menampilkan Indonesia + 中文 + Inggris bertumpuk. */
const trKey = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
                     .toLowerCase().replace(/[^a-z]/g,"");
/* surfTr = transliterasi kata sebenarnya yang SUDAH tampil di atas baris ini.
   Kalau transliterasi kata dasar dari kamus ternyata sama persis, jangan
   ditampilkan dua kali. */
function glossLines(g, surfTr){
  const out = [];
  const push = (v,cls) => { if(v) out.push([v,cls]); };
  const lt = (surfTr && g.tr && trKey(g.tr) === trKey(surfTr)) ? "" : g.tr;
  switch(S.gloss){
    case "id":  push(g.id || g.en || lt, "gl"); break;
    case "zh":  push(g.zh || g.en || lt, "gl zh"); break;
    case "en":  push(g.en || lt, "gl"); break;
    case "mix":
      push(g.id, "gl");
      push(g.zh, "gl zh");
      push(g.en, "gl dim");
      if(!out.length) push(lt, "gl dim");
      break;
    default:    push(g.id || g.en || lt, "gl");
  }
  return out;
}

const chCache = new Map(), inflight = new Map();

/* Versi mesin teks. Dinaikkan setiap kali aturan spasi/penggabungan berubah,
   supaya unduhan offline lama — yang teksnya dirakit dengan aturan lama —
   bisa dikenali dan dirapikan ulang saat dimuat (lihat offlineLoad). */
const TEXT_ENGINE = 3;

const RX_CJK   = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF]/;
const RX_CLOSE = /^[,.;:!?%\u2019\u201D\u00BB)\]}\u2026]/;   // menempel ke kata sebelumnya
const RX_OPEN  = /[(\[{\u2018\u201C\u00AB\u2014-]$/;          // menempel ke kata sesudahnya

/* Rapikan spasi satu potong teks ayat.
   Dua arah perbaikan:
   1. spasi yang HILANG sesudah tanda baca — "keadilan,tetapi" -> "keadilan, tetapi";
   2. spasi yang BERLEBIH sebelum tanda baca — "keadilan ," -> "keadilan,".
   Syaratnya sempit supaya tidak merusak yang benar: sesudah tanda baca harus
   ada HURUF, jadi "3:16", "1.5", dan kutip penutup (,") tidak ikut disisipi.
   Teks CJK dilewati — bahasa itu memang tidak memakai spasi antar kata. */
function normTxt(s){
  s = (s || "").replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
  if(!s || RX_CJK.test(s)) return s;
  return s
    .replace(/([,;:])(?=\p{L})/gu, "$1 ")
    .replace(/([.!?])(?=\p{L})/gu, "$1 ")
    .replace(/([\u201D\u00BB])(?=\p{L})/gu, "$1 ")
    .replace(/(\p{L})(?=[\u201C\u00AB])/gu, "$1 ")
    .replace(/\s+([,.;:!?\u2019\u201D\u00BB)\]}])/g, "$1")
    .replace(/([(\[{\u2018\u201C\u00AB])\s+/g, "$1")
    .replace(/\s+/g," ")
    .trim();
}

/* Gabungkan potongan-potongan satu ayat.
   Dulu semuanya disambung dengan join(" ") — itu memperbaiki kata yang
   menempel, tapi malah menyisipkan spasi di depan koma dan di antara aksara
   Tionghoa. Sekarang spasi hanya ditambahkan bila kedua sisi memang butuh. */
function joinPieces(parts){
  let out = "";
  for(const raw of parts){
    const p = (raw || "").replace(/\u00a0/g," ");
    if(!p) continue;
    if(!out){ out = p; continue; }
    const a = out[out.length-1], b = p[0];
    const glue = /\s/.test(a) || /\s/.test(b) ||
                 RX_CJK.test(a) || RX_CJK.test(b) ||
                 RX_CLOSE.test(p) || RX_OPEN.test(out);
    out += (glue ? "" : " ") + p;
  }
  return out;
}

function flat(c){
  // Setiap potongan (string / FormattedText) di array `content` adalah unit
  // terpisah: baris puisi, penggal sebelum/sesudah catatan kaki, dan
  // seterusnya. Potongan yang bukan teks ({noteId}, {lineBreak}, {heading})
  // tidak menyumbang isi ayat.
  const parts = [];
  const walk = list => {
    for(const it of list || []){
      if(it == null) continue;
      if(typeof it === "string"){ parts.push(it); continue; }
      if(Array.isArray(it)){ walk(it); continue; }
      if(typeof it.text === "string") parts.push(it.text);
    }
  };
  walk(c);
  return normTxt(joinPieces(parts));
}

/* Kalau peramban menolak permintaan lintas-domain, pengguna bisa mengisi
   alamat proksi di ⚙; alamat API ditempel di belakangnya ter-encode. */
function apiFetch(url, opt){
  const px = apiProxy();
  return fetch(px ? px + encodeURIComponent(url) : url, opt);
}
function apiErr(e, label){
  const m = (e && e.message) ? e.message : String(e);
  if(/failed to fetch|networkerror|load failed|cors/i.test(m))
    return `${label} tidak bisa dihubungi dari peramban — biasanya karena CORS. Isi "Proksi" di ⚙, atau periksa koneksi.`;
  return `${label}: ${m}`;
}

/* Keluaran teks ESV menomori ayat dengan kurung siku: "[1] In the ... [2] ..." */
function parseBracketVerses(txt){
  const m = new Map();
  const re = /\[(\d+)\]/g;
  let mt, cur = null, from = 0;
  while((mt = re.exec(txt))){
    if(cur != null){ const t = normTxt(txt.slice(from, mt.index)); if(t) m.set(cur, t); }
    cur = +mt[1]; from = re.lastIndex;
  }
  if(cur != null){ const t = normTxt(txt.slice(from)); if(t) m.set(cur, t); }
  return m;
}

async function fetchESV(b, ch){
  const key = apiKey("esv");
  if(!key) return {ok:false, needKey:"esv", msg:"Kunci API ESV belum diisi. Buka ⚙ → “Versi berlisensi (ESV & NLT)”."};
  const url = "https://api.esv.org/v3/passage/text/?q=" + encodeURIComponent(`${b.en} ${ch}`)
    + "&include-passage-references=false&include-verse-numbers=true&include-first-verse-numbers=true"
    + "&include-footnotes=false&include-footnote-body=false&include-headings=false"
    + "&include-short-copyright=false&include-copyright=false"
    + "&include-passage-horizontal-lines=false&include-heading-horizontal-lines=false"
    + "&indent-poetry=false&indent-paragraphs=0&indent-declares=0&indent-psalm-doxology=0";
  const r = await apiFetch(url, {headers:{Authorization:"Token " + key}});
  if(r.status === 401 || r.status === 403)
    return {ok:false, needKey:"esv", msg:"Kunci API ESV ditolak server (" + r.status + "). Periksa kuncinya di ⚙."};
  if(r.status === 429) return {ok:false, msg:"Kuota harian API ESV habis. Coba lagi besok."};
  if(!r.ok) return {ok:false, msg:"ESV HTTP " + r.status};
  const j = await r.json();
  const txt = (j.passages || []).join("\n").trim();
  if(!txt) return {ok:false, missing:true, msg:"Bagian ini tidak ada dalam ESV."};
  const m = parseBracketVerses(txt);
  if(!m.size) return {ok:false, msg:"Balasan ESV tidak bisa dibaca."};
  return {ok:true, m};
}

async function fetchNLT(b, ch){
  const key = apiKey("nlt");
  if(!key) return {ok:false, needKey:"nlt", msg:"Kunci API NLT belum diisi. Buka ⚙ → “Versi berlisensi (ESV & NLT)”."};
  const ref = `${NLT_ABBR[b.id] || b.en}.${ch}`;
  const url = "https://api.nlt.to/api/passages?ref=" + encodeURIComponent(ref)
            + "&version=NLT&key=" + encodeURIComponent(key);
  const r = await apiFetch(url);
  if(r.status === 401 || r.status === 403)
    return {ok:false, needKey:"nlt", msg:"Kunci API NLT ditolak server (" + r.status + "). Periksa kuncinya di ⚙."};
  if(!r.ok) return {ok:false, msg:"NLT HTTP " + r.status};
  const html = await r.text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  const m = new Map();
  doc.querySelectorAll("verse_export").forEach(node => {
    const vn = Number(node.getAttribute("vn"));
    if(!Number.isFinite(vn) || vn <= 0) return;
    const c = node.cloneNode(true);
    // buang nomor ayat, judul perikop, dan catatan kaki supaya tersisa teksnya
    c.querySelectorAll("h1,h2,h3,sup,.vn,.tn,.a-tn,.tn-ref,.subhead,.subhead-mid,.chapter-number,.bk_ch_vs_header")
     .forEach(x => x.remove());
    const t = normTxt(c.textContent || "");
    if(t) m.set(vn, t);
  });
  if(!m.size) return {ok:false, missing:true, msg:"Bagian ini tidak ada dalam NLT, atau balasannya tidak dikenali."};
  return {ok:true, m};
}

  if(chCache.has(k)) return chCache.get(k);

  const b = bk(bookId);
  const ver = VER[vid] || {};
  const p = (async () => {
    // 0) versi berlisensi: langsung ke API penerbit, tidak lewat helloao
    //    dan tidak pernah disimpan offline
    if(ver.api){
      try{
        const res = ver.api === "esv" ? await fetchESV(b, ch) : await fetchNLT(b, ch);
        if(res.ok) chCache.set(k, res);
        return res;
      }catch(e){
        return {ok:false, msg:apiErr(e, ver.abbr || vid)};
      }finally{ inflight.delete(k); }
    }
    // 1) teks offline lebih dulu — supaya tetap terbaca tanpa jaringan
    try{
      const off = await offlineLoad(vid);
      if(off){
        const m = new Map();
        for(let n=1;n<=200;n++){
          const t = off.get(`${bookId}.${ch}.${n}`);
          if(t) m.set(n, t);
        }
        if(m.size){ const res = {ok:true, m, offline:true}; chCache.set(k,res); return res; }
      }
    }catch{}
    try{
      const r = await fetch(`${AO}/${encodeURIComponent(vid)}/${b.usfm}/${ch}.json`);
      if(r.status === 404) throw new Error("__404__");
      if(!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const m = new Map();
      for(const it of j?.chapter?.content || []){
        if(it?.type === "verse" && it.number != null){
          const t = flat(it.content);
          const vn = Number(it.number);
          if(t && Number.isFinite(vn)) m.set(vn, t);
        }
      }
      if(!m.size) throw new Error("__404__");
      const res = {ok:true, m};
      chCache.set(k,res); return res;
    }catch(e){
      const res = {ok:false, missing:e.message === "__404__", msg:e.message};
      if(res.missing) chCache.set(k,res);
      return res;
    }finally{ inflight.delete(k); }
  })();
  inflight.set(k,p); return p;
}

/* verifikasi ID versi bawaan yang belum sempat diuji saat build.
   Hanya 404 yang dianggap "ID tidak ada" — kegagalan jaringan biasa
   TIDAK menandai versi sebagai rusak, supaya versi sah tidak hilang
   hanya karena koneksi sedang putus. */
async function verifySeeds(){
  const probes = SEED.filter(v => v.probe);
  let changed = false;
  for(const v of probes){
    try{
      const r = await fetch(`${AO}/${v.id}/GEN/1.json`);
      if(r.status === 404){
        VER[v.id].broken = true;
        S.cols = S.cols.filter(c => c !== v.id);
        changed = true;
      }
    }catch{ /* jaringan bermasalah — biarkan apa adanya */ }
  }
  if(changed){ if(!S.cols.length) S.cols = ["ind_ayt"]; persist(); chips(); render(); }
}

/* =========================================================
   KAMUS STRONG'S
   ========================================================= */
let SG=null, SH=null, GLEM=null;
const pd = t => JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}")+1));
async function dict(w){
  if(w === "G" && SG) return SG;
  if(w === "H" && SH) return SH;
  const r = await fetch(w === "G" ? SGRK : SHEB);
  if(!r.ok) throw new Error("kamus HTTP " + r.status);
  const d = pd(await r.text());
  if(w === "G") SG = d; else SH = d;
  return d;
}
function bare(t){
  return t.normalize("NFD").replace(/[\u0300-\u036f\u0483-\u0489]/g,"")
          .toLowerCase().replace(/ς/g,"σ").replace(/[^\p{L}]/gu,"");
}
function gidx(d){
  if(GLEM) return GLEM;
  GLEM = new Map();
  for(const k in d){ const l = d[k].lemma; if(l){ const b = bare(l); if(!GLEM.has(b)) GLEM.set(b,k); } }
  return GLEM;
}

/* =========================================================
   BAHASA ASLI
   Yang ditampilkan di baris interlinear adalah KATA SEBENARNYA seperti
   tertulis di naskah (sudah berimbuhan/berinfleksi), bukan kata dasarnya.
   Transliterasi di bawahnya pun dihitung dari kata itu, bukan diambil dari
   kamus — kamus Strong's hanya punya transliterasi bentuk dasar, dan itulah
   yang dulu membuat ἐποίησεν tertulis "poieō". Kata dasarnya tetap
   ada, tapi tempatnya di kartu penjelasan (wordCard) bersama kata aslinya.
   ========================================================= */
const GRK_TR = {"α":"a","β":"b","γ":"g","δ":"d","ε":"e","ζ":"z","η":"ē","θ":"th","ι":"i","κ":"k",
  "λ":"l","μ":"m","ν":"n","ξ":"x","ο":"o","π":"p","ρ":"r","σ":"s","ς":"s","τ":"t",
  "υ":"y","φ":"ph","χ":"ch","ψ":"ps","ω":"ō"};
function trGrk(w){
  const d = (w || "").normalize("NFD");
  let rough = false, base = "";
  for(const ch of d){
    const c = ch.codePointAt(0);
    if(c === 0x0314){ rough = true; continue; }        // spiritus asper -> h
    if(c >= 0x0300 && c <= 0x036f) continue;           // aksen, iota subscript, dll.
    if(/\p{L}/u.test(ch)) base += ch.toLowerCase();
  }
  if(!base) return "";
  const s2 = base
    .replace(/γ(?=[γκξχ])/g,"n")
    .replace(/ου/g,"ou").replace(/αυ/g,"au").replace(/ευ/g,"eu")
    .replace(/ηυ/g,"ēu").replace(/υι/g,"ui");
  let out = "";
  for(const ch of s2) out += (GRK_TR[ch] != null ? GRK_TR[ch] : ch);
  if(rough) out = (out[0] === "r") ? "rh" + out.slice(1) : "h" + out;
  return out;
}

const HEB_C = {"א":"ʾ","ב":"b","ג":"g","ד":"d","ה":"h","ו":"w","ז":"z","ח":"kh","ט":"ṭ","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"ʿ","פ":"p","ף":"p",
  "צ":"ts","ץ":"ts","ק":"q","ר":"r","ש":"sh","ת":"t"};
const HEB_V = {0x05B0:"ə",0x05B1:"e",0x05B2:"a",0x05B3:"o",0x05B4:"i",0x05B5:"e",0x05B6:"e",
  0x05B7:"a",0x05B8:"a",0x05B9:"o",0x05BA:"o",0x05BB:"u",0x05C7:"o"};
function trHeb(w){
  const s2 = (w || "").normalize("NFC");
  let out = "";
  for(let i=0;i<s2.length;i++){
    const ch = s2[i];
    if(ch === "־" || ch === "-"){ out += "-"; continue; }
    if(!HEB_C[ch]) continue;                       // tanda yang berdiri sendiri: lewati
    const marks = [];
    let j = i + 1;
    while(j < s2.length){
      const cc = s2.charCodeAt(j);
      if(cc === 0x05BE) break;                     // maqaf = pemisah kata
      if(cc >= 0x0591 && cc <= 0x05C7){ marks.push(cc); j++; }
      else break;
    }
    i = j - 1;
    if(ch === "ו"){                                // waw: shuruq/holam jadi vokal
      if(marks.includes(0x05BC)){ out += "u"; continue; }
      if(marks.includes(0x05B9)){ out += "o"; continue; }
    }
    out += (ch === "ש") ? (marks.includes(0x05C2) ? "s" : "sh") : HEB_C[ch];
    for(const mk of marks){ const v = HEB_V[mk]; if(v) out += v; }
  }
  return out.replace(/ə$/,"");
}

/* Morfologi. Yunani memakai kode MorphGNT (POS + 8 huruf parsing);
   Ibrani memakai kode OSHM yang bersegmen ("HR/Ncfsa"), dan di sini
   hanya jenis kata tiap segmennya yang diterjemahkan. */
const G_POS = {"N-":"kata benda","A-":"kata sifat","RA":"kata sandang","RD":"kata tunjuk",
  "RI":"kata tanya / tak tentu","RP":"kata ganti orang","RR":"kata ganti penghubung",
  "C-":"kata sambung","D-":"kata keterangan","I-":"seruan","P-":"kata depan",
  "V-":"kata kerja","X-":"partikel"};
const G_TENSE = {P:"kini",I:"imperfek",F:"futur",A:"aoris",X:"perfek",Y:"pluperfek"};
const G_VOICE = {A:"aktif",M:"medial",P:"pasif"};
const G_MOOD  = {I:"indikatif",D:"imperatif",S:"subjungtif",O:"optatif",N:"infinitif",P:"partisip"};
const G_CASE  = {N:"nominatif",G:"genitif",D:"datif",A:"akusatif",V:"vokatif"};
const G_NUM   = {S:"tunggal",P:"jamak"};
const G_GEN   = {M:"maskulin",F:"feminin",N:"netral"};
const G_DEG   = {C:"komparatif",S:"superlatif"};
function morfGrk(pos, parse){
  const out = [];
  if(G_POS[pos]) out.push(G_POS[pos]);
  const c = (parse || "").padEnd(8,"-");
  if(/[123]/.test(c[0])) out.push("orang ke-" + c[0]);
  [[G_TENSE,1],[G_VOICE,2],[G_MOOD,3],[G_CASE,4],[G_NUM,5],[G_GEN,6],[G_DEG,7]]
    .forEach(([map,i]) => { const v = map[c[i]]; if(v) out.push(v); });
  return out.join(" · ");
}
const H_POS = {A:"kata sifat",C:"kata sambung",D:"kata keterangan",N:"kata benda",
  P:"kata ganti",R:"kata depan",S:"akhiran pronominal",T:"partikel",V:"kata kerja"};
function morfHeb(code){
  if(!code) return "";
  return code.replace(/^[HA]/,"").split("/").filter(Boolean)
    .map(seg => H_POS[seg[0]] || seg).join(" + ");
}

const ilCache = new Map(), hebF = new Map(), grkF = new Map();
async function getIL(bookId, ch){
  const k = bookId + "|" + ch;
  if(ilCache.has(k)) return ilCache.get(k);
  const b = bk(bookId);
  const r = b.t === "PL" ? await heb(b,ch) : await grk(b,ch);
  ilCache.set(k,r); return r;
}
async function heb(b, ch){
  try{
    const d = await dict("H");
    if(!hebF.has(b.src)){
      const r = await fetch(`${HEB}/${b.src}.xml`);
      if(!r.ok) throw new Error("HTTP " + r.status);
      hebF.set(b.src, await r.text());
    }
    const xml = hebF.get(b.src), m = new Map();
    const re = new RegExp(`<verse osisID="${b.src}\\.${ch}\\.(\\d+)"([\\s\\S]*?)</verse>`,"g");
    let v;
    while((v = re.exec(xml))){
      const ws = [], wre = /<w\b([^>]*)>([\s\S]*?)<\/w>/g;
      let w;
      while((w = wre.exec(v[2]))){
        const lem = (w[1].match(/lemma="([^"]*)"/) || [,""])[1];
        const mor = (w[1].match(/morph="([^"]*)"/) || [,""])[1];
        const nums = lem.match(/\d+/g);
        const sn = nums ? "H" + nums[nums.length-1] : null;
        // isi <w> = kata sebagaimana tertulis di naskah (sudah berimbuhan)
        const surf = w[2].replace(/<[^>]*>/g,"").replace(/\//g,"");
        ws.push({o:surf, s:sn, mp:mor, tr:trHeb(surf), g:gloss(d,sn)});
      }
      if(ws.length) m.set(+v[1], ws);
    }
    if(!m.size) return {ok:false, msg:"Pasal ini tidak ada dalam naskah Ibrani."};
    return {ok:true, rtl:true, m};
  }catch(e){ return {ok:false, msg:"Naskah Ibrani gagal dimuat (" + e.message + ")."}; }
}
async function grk(b, ch){
  try{
    const d = await dict("G"), idx = gidx(d);
    if(!grkF.has(b.src)){
      const r = await fetch(`${GRK}/${b.src}-morphgnt.txt`);
      if(!r.ok) throw new Error("HTTP " + r.status);
      grkF.set(b.src, await r.text());
    }
    const want = String(ch).padStart(2,"0"), m = new Map();
    for(const line of grkF.get(b.src).split("\n")){
      if(!line) continue;
      const p = line.split(" ");
      if(p.length < 7 || p[0].slice(2,4) !== want) continue;
      const v = +p[0].slice(4,6);
      const sn = idx.get(bare(p[6])) || null;
      if(!m.has(v)) m.set(v,[]);
      // kolom MorphGNT: 0 BCV · 1 jenis kata · 2 parsing · 3 teks apa adanya
      // · 4 kata tanpa tanda baca · 5 bentuk baku · 6 kata dasar (lemma)
      m.get(v).push({o:p[3], s:sn, l:p[6], pos:p[1], ps:p[2], tr:trGrk(p[4] || p[3]), g:gloss(d,sn)});
    }
    if(!m.size) return {ok:false, msg:"Pasal ini tidak ada dalam naskah Yunani."};
    return {ok:true, rtl:false, m};
  }catch(e){ return {ok:false, msg:"Naskah Yunani gagal dimuat (" + e.message + ")."}; }
}

/* =========================================================
   UNDUHAN OFFLINE
   Satu terjemahan penuh bisa 3–10 MB, jauh melewati batas
   localStorage (~5 MB), jadi teks offline disimpan di IndexedDB.

   Dua jalur pengambilan:
   1. /api/{id}/complete.json — satu berkas untuk seluruh Alkitab.
      Tercantum di available_translations.json sebagai
      completeTranslationApiLink, tapi TIDAK ada di panduan resmi,
      jadi tidak dijamin selalu tersedia.
   2. Bila jalur 1 gagal, jatuh ke endpoint resmi
      /api/{id}/{BOOK}/{ch}.json per pasal, dengan jeda kecil
      supaya server tidak dibanjiri.
   Jalur 2 lebih lambat tapi memakai endpoint terdokumentasi,
   sehingga fitur ini tetap hidup walau jalur 1 dihapus.
   ========================================================= */
const DB_NAME = "webbase-offline", DB_VER = 2, STORE = "tr", MSTORE = "media";
let _db = null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej) => {
    if(!("indexedDB" in window)) return rej(new Error("IndexedDB tidak tersedia di peramban ini"));
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if(!d.objectStoreNames.contains(STORE))  d.createObjectStore(STORE,  {keyPath:"id"});
      // v2: lampiran foto & audio catatan. Store terpisah supaya
      // getAll() daftar unduhan tidak ikut menarik berkas media.
      if(!d.objectStoreNames.contains(MSTORE)) d.createObjectStore(MSTORE, {keyPath:"id"});
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error || new Error("IndexedDB gagal dibuka"));
  });
}
function idb(mode, fn, store){
  const name = store || STORE;
  return db().then(d => new Promise((res,rej) => {
    const tx = d.transaction(name, mode);
    let req;
    try{ req = fn(tx.objectStore(name)); }catch(e){ return rej(e); }
    tx.oncomplete = () => res(req ? req.result : undefined);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error("Transaksi dibatalkan"));
  }));
}

/* ---------- lampiran media catatan ----------
   Berkas (Blob) disimpan di IndexedDB untuk akses cepat/offline, dan
   diunggah ke Supabase Storage (bucket MEDIA_BUCKET) bila pengguna
   sedang masuk akun — sehingga foto/audio ikut tersedia di perangkat
   lain, bukan cuma teksnya. S.media menyimpan indeks ringan per ayat
   (termasuk `path` bila sudah tersinkron) supaya perangkat lain bisa
   mengunduh berkasnya walau belum pernah menyimpannya secara lokal. */
let mediaSeq = 0;
function newMediaId(){
  mediaSeq++;
  return "m" + Date.now().toString(36) + mediaSeq.toString(36) + Math.random().toString(36).slice(2,6);
}
function findMediaMeta(id){
  for(const vk in S.media){
    const m = S.media[vk].find(x => x.id === id);
    if(m) return {...m, vk};
  }
  return null;
}
async function uploadMedia(vk, id, blob, mime){
  if(!S.user || !sb) return;
  try{
    const path = `${S.user.id}/${id}`;
    const {error} = await sb.storage.from(MEDIA_BUCKET).upload(path, blob, {contentType:mime, upsert:true});
    if(error) throw error;
    const entry = (S.media[vk] || []).find(x => x.id === id);
    if(entry){ entry.path = path; entry.cloud = true; }
    persist(); schedulePush();
  }catch(e){ console.error("uploadMedia:", e.message); }
}
async function syncPendingMedia(){
  if(!S.user || !sb) return;
  for(const vk of Object.keys(S.media)){
    for(const entry of S.media[vk]){
      if(entry.path) continue;
      const rec = await idb("readonly", st => st.get(entry.id), MSTORE).catch(() => null);
      if(rec && rec.blob) await uploadMedia(vk, entry.id, rec.blob, entry.mime || rec.mime);
    }
  }
}
async function mediaPut(vk, type, blob){
  const id = newMediaId();
  const mime = blob.type;
  await idb("readwrite", st => st.put({id, vk, type, blob, mime, at:Date.now()}), MSTORE);
  if(!S.media[vk]) S.media[vk] = [];
  S.media[vk].push({id, type, at:Date.now(), mime});
  persist();
  uploadMedia(vk, id, blob, mime);   // async — tidak menunggu, jalan di latar belakang
  return id;
}
async function mediaGet(id){
  try{
    const local = await idb("readonly", st => st.get(id), MSTORE);
    if(local && local.blob) return local;
  }catch{}
  // tidak ada salinan lokal (mis. perangkat lain) — coba ambil dari server
  if(!sb) return null;
  const meta = findMediaMeta(id);
  if(!meta || !meta.path) return null;
  try{
    const {data, error} = await sb.storage.from(MEDIA_BUCKET).download(meta.path);
    if(error || !data) return null;
    const rec = {id, vk:meta.vk, type:meta.type, blob:data, mime:meta.mime || data.type, at:meta.at};
    try{ await idb("readwrite", st => st.put(rec), MSTORE); }catch{}   // simpan cache lokal
    return rec;
  }catch{ return null; }
}
async function mediaDel(vk, id){
  const meta = (S.media[vk] || []).find(x => x.id === id);
  try{ await idb("readwrite", st => st.delete(id), MSTORE); }catch{}
  if(S.media[vk]){
    S.media[vk] = S.media[vk].filter(x => x.id !== id);
    if(!S.media[vk].length) delete S.media[vk];
  }
  persist();
  if(meta?.path && sb) sb.storage.from(MEDIA_BUCKET).remove([meta.path]).catch(() => {});
}
async function mediaDelAllFor(vk){
  const list = S.media[vk] || [];
  for(const m of list){ try{ await idb("readwrite", st => st.delete(m.id), MSTORE); }catch{} }
  const paths = list.filter(m => m.path).map(m => m.path);
  delete S.media[vk];
  persist();
  if(paths.length && sb) sb.storage.from(MEDIA_BUCKET).remove(paths).catch(() => {});
}
const mediaCount = vk => (S.media[vk] || []).length;

const OFF = new Map();               // id -> Map("bookId.ch.n" -> teks)
async function offlineList(){
  try{ return (await idb("readonly", st => st.getAll())) || []; }catch{ return []; }
}
async function offlineLoad(id){
  if(OFF.has(id)) return OFF.get(id);
  try{
    const rec = await idb("readonly", st => st.get(id));
    if(!rec || !rec.data) return null;
    let entries = Object.entries(rec.data);
    // Unduhan lama dirakit dengan aturan spasi versi sebelumnya, jadi masih
    // ada kata yang menempel. Karena teks offline dipakai LEBIH DULU daripada
    // jaringan, perbaikan di flat() saja tidak terasa — jadi teks lama
    // dirapikan di sini saat dimuat, tanpa harus unduh ulang.
    const tv = (rec.meta && rec.meta.tv) || 0;
    if(tv < TEXT_ENGINE) entries = entries.map(([k,v]) => [k, normTxt(v)]);
    const m = new Map(entries);
    OFF.set(id, m);
    return m;
  }catch{ return null; }
}

const USFM2ID = {};
BOOKS.forEach(b => USFM2ID[b.usfm] = b.id);

function versesFromChapter(j, bid, ch, out){
  // jaring pengaman: nomor pasal HARUS angka. Tanpa ini, pemanggil yang
  // keliru bisa menulis kunci "kitab.[object Object].1" yang tak akan
  // pernah terbaca lagi — dan kerusakannya baru ketahuan jauh kemudian.
  const chN = Number(ch);
  if(!Number.isFinite(chN)) return 0;
  let n = 0;
  for(const it of j?.chapter?.content || []){
    if(it?.type === "verse" && it.number != null){
      const t = flat(it.content);
      const vn = Number(it.number);
      // sebagian versi memberi label ayat non-angka (mis. ayat gabungan
      // "3-4"); jangan disimpan — kunci "buku.pasal.NaN" akan tabrakan
      // dan menimpa ayat lain, dan ini yang bikin hasil pencarian NaN.
      if(t && Number.isFinite(vn)){ out[`${bid}.${chN}.${vn}`] = t; n++; }
    }
  }
  return n;
}

async function tryComplete(id, out, onProgress){
  const r = await fetch(`${AO}/${id}/complete.json`);
  if(!r.ok) throw new Error("HTTP " + r.status);
  const total = +(r.headers.get("content-length") || 0);
  let text;
  if(total && r.body && r.body.getReader){
    const rd = r.body.getReader(); const parts = []; let got = 0;
    for(;;){
      const {done,value} = await rd.read();
      if(done) break;
      parts.push(value); got += value.length;
      onProgress({pct:Math.round(got/total*90), msg:`Mengunduh ${(got/1048576).toFixed(1)} MB`});
    }
    text = new TextDecoder().decode(await new Blob(parts).arrayBuffer());
  }else{
    onProgress({msg:"Mengunduh…"});
    text = await r.text();
  }
  onProgress({pct:92, msg:"Memproses…"});
  const j = JSON.parse(text);
  let n = 0, badCh = 0;
  for(const b of j?.books || []){
    const bid = USFM2ID[b.id || b.book || b.bookId];
    if(!bid) continue;
    for(const c of b.chapters || []){
      // nomor pasal harus angka valid — beberapa API menaruhnya di tempat berbeda
      const num = Number(
        c?.number ?? c?.chapterNumber ?? c?.chapter?.number ?? c?.chapter?.chapterNumber
      );
      if(!Number.isFinite(num)){ badCh++; continue; }
      n += versesFromChapter(c?.chapter ? c : {chapter:c}, bid, num, out);
    }
  }
  if(!n) throw new Error("complete.json kosong / format berbeda");
  if(badCh) console.warn("tryComplete: " + badCh + " pasal dilewati (nomor pasal tidak terbaca)");
  return n;
}

async function perChapter(id, out, onProgress, ctl){
  const totalCh = BOOKS.reduce((s,b) => s + b.ch, 0);
  let done = 0, n = 0;
  for(const b of BOOKS){
    let bookMissing = false;
    for(let c=1;c<=b.ch;c++){
      if(ctl && ctl.stop) throw new Error("__ABORT__");
      try{
        const r = await fetch(`${AO}/${id}/${b.usfm}/${c}.json`);
        if(r.ok) n += versesFromChapter(await r.json(), b.id, c, out);
        else if(r.status === 404){ bookMissing = true; }
      }catch{}
      done++;
      if(done % 5 === 0) onProgress({pct:Math.round(done/totalCh*100), msg:`${b.name} ${c} · ${n.toLocaleString("id-ID")} ayat`});
      await new Promise(r => setTimeout(r, 12));
      if(bookMissing) break;              // kitab tak ada di versi ini
    }
    if(bookMissing) done += 0;
  }
  if(!n) throw new Error("Tidak ada pasal yang berhasil diunduh");
  return n;
}

async function downloadVersion(id, onProgress, ctl){
  const v = VER[id] || {};
  if(v.api) throw new Error("Versi berlisensi tidak boleh disimpan offline");
  const out = {};
  let n = 0, via = "berkas utuh";
  onProgress({pct:0, msg:"Menyiapkan…"});
  try{
    n = await tryComplete(id, out, onProgress);
  }catch(e){
    if(e.message === "__ABORT__") throw e;
    via = "per pasal";
    onProgress({pct:0, msg:"Berkas utuh tidak tersedia — mengunduh per pasal…"});
    n = await perChapter(id, out, onProgress, ctl);
  }
  onProgress({pct:98, msg:"Menyimpan…"});

  // validasi sebelum disimpan: pastikan kunci ayat berformat benar
  const keys = Object.keys(out);
  if(!keys.length) throw new Error("tidak ada ayat yang tersimpan");
  const bad = keys.filter(k => !/^[a-z0-9]+\.\d+\.\d+$/.test(k));
  if(bad.length){
    console.warn("kunci rusak, contoh:", bad.slice(0,3));
    throw new Error(`${bad.length} kunci ayat rusak (mis. "${bad[0]}") — format data tidak dikenali`);
  }
  const probe = keys[0].split(".");
  if(!out[`${probe[0]}.${probe[1]}.${probe[2]}`]) throw new Error("hasil unduhan tidak bisa dibaca kembali");

  const bytes = JSON.stringify(out).length;
  await idb("readwrite", st => st.put({
    id, data:out,
    meta:{name:v.name || id, abbr:v.abbr || id, verses:n, bytes, at:Date.now(), via, tv:TEXT_ENGINE}
  }));
  OFF.delete(id);
  NORM_IDX.delete(id);
  onProgress({pct:100, msg:"Selesai"});
  return {n, bytes, via};
}
async function deleteVersion(id){
  await idb("readwrite", st => st.delete(id));
  OFF.delete(id);
  NORM_IDX.delete(id);
}

function fmtMB(b){ return b >= 1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB"; }

function offlinePicker(){
  ov("Unduhan offline", box => {
    const info = el("p","hint","Teks yang sudah diunduh dibaca langsung dari perangkat — tetap bisa dipakai tanpa internet. Bahasa asli juga bisa diunduh di bagian bawah.");

        if(e.quota) quota.textContent = `Ruang terpakai ${fmtMB(e.usage||0)} dari kuota ${fmtMB(e.quota)} yang diizinkan peramban.`;
      }).catch(() => {});
    }

    const list = el("div");
    box.appendChild(list);

    const draw = async () => {
      list.innerHTML = "";
      const saved = await offlineList();
      const savedMap = new Map(saved.map(r => [r.id, r.meta || {}]));

      list.appendChild(el("div","sechead","Versi terpasang"));

        const btn = el("button","btn" + (meta ? " warn" : " ghost"), meta ? "Hapus" : "Unduh");
        btn.style.flex = "none";
        btn.onclick = async () => {
          if(meta){

            chCache.clear();

          cancel.style.flex = "none";
          cancel.onclick = () => { ctl.stop = true; };
          row.replaceChild(cancel, btn);
          try{
            const r = await downloadVersion(id, p => {
              if(p.pct != null) fill.style.width = p.pct + "%";
              if(p.msg) st.textContent = p.msg;
            }, ctl);
            chCache.clear();
            toast(`${v.abbr} siap offline — ${r.n.toLocaleString("id-ID")} ayat`);
            draw(); render();
          }catch(e){
            if(e.message === "__ABORT__"){ toast("Unduhan dibatalkan"); }
            else{ st.textContent = "Gagal: " + e.message; toast("Unduhan gagal"); }

      });

        list.appendChild(el("p","hint","ESV dan NLT tidak bisa diunduh \u2014 lisensinya tidak mengizinkan penyimpanan teks penuh di perangkat, jadi keduanya selalu perlu jaringan."));

        if(om){

        bar.style.cssText = "height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:8px";
        const fill = el("div");

        bar.appendChild(fill);
        const stx = el("i"); stx.style.cssText = "display:block;font-size:11px;color:var(--ink2);margin-top:4px";
        ot.appendChild(bar); ot.appendChild(stx);
        const cancel = el("button","btn ghost","Batal"); cancel.style.flex = "none";

        orow.replaceChild(cancel, obtn);
        try{
          const r = await downloadOriginals(p => {
            if(p.pct != null) fill.style.width = p.pct + "%";
            if(p.msg) stx.textContent = p.msg;
          }, ctl);
          origLoaded = false; await primeOriginals();
          ilCache.clear();
          toast("Bahasa asli siap offline — " + fmtMB(r.bytes));
          draw(); render();
        }catch(e){
          if(e.message === "__ABORT__") toast("Unduhan dibatalkan");
          else{ stx.textContent = "Gagal: " + e.message; toast("Unduhan gagal"); }
          draw();
        }
      };
      orow.appendChild(obtn);
      list.appendChild(orow);

      // unduhan versi yang sudah tidak terpasang lagi
      const orphans = saved.filter(r => !VER[r.id] && r.id !== SRC_KEY);
      if(orphans.length){
        list.appendChild(el("div","sechead","Unduhan lain"));
        orphans.forEach(r => {
          const row = el("div","res");
          const t = el("div","t");
          t.appendChild(el("b", null, r.meta?.name || r.id));
          t.appendChild(el("i", null, `${fmtMB(r.meta?.bytes||0)} · versi tidak lagi terpasang`));
          row.appendChild(t);
          const d = el("button","btn warn","Hapus"); d.style.flex = "none";
          d.onclick = async () => { await deleteVersion(r.id); draw(); toast("Dihapus"); };
          row.appendChild(d);
          list.appendChild(row);
        });
      }
    };
    draw();
  });
}

async function runDiag(host){
  host.innerHTML = "";
  const line = (state, txt) => {
    const d = el("div","diag " + state);
    d.appendChild(el("b", null, state === "ok" ? "✓" : state === "bad" ? "✕" : "…"));
    d.appendChild(el("div","d", txt));

    return d;
  };
  if(!sb){ line("bad","Pustaka Supabase gagal dimuat. Muat ulang halaman."); return; }
  if(!S.user){ line("wait","Belum masuk."); return; }

  const l = line("wait","Menguji sinkronisasi…");
  try{
    const {error} = await sb.from("webbase_sync").upsert({
      user_id:S.user.id,
      data:{stab:S.stab, mark:S.mark, notes:S.notes, noteColor:S.noteColor, pin:S.pin, plan:S.plan, media:S.media},
      updated_at:new Date().toISOString()
    });
    if(error) throw error;
    l.className = "diag ok"; l.firstChild.textContent = "✓";
    l.lastChild.textContent = "Sinkronisasi aktif — catatan tersimpan ke server.";
    S.syncState = "synced"; syncLabel();

    l.lastChild.textContent = "Gagal menyimpan: " + e.message;
  }
}

/* =========================================================
   UNDUHAN BAHASA ASLI
   Ibrani (39 berkas XML) + Yunani (27 berkas teks) + 2 kamus Strong's.
   Disimpan di IndexedDB dengan awalan "src:" supaya tidak bentrok
   dengan unduhan terjemahan.
   ========================================================= */
const SRC_KEY = "src:orig";

async function downloadOriginals(onProgress, ctl){
  const ot = BOOKS.filter(b => b.t === "PL");
  const nt = BOOKS.filter(b => b.t === "PB");
  const total = ot.length + nt.length + 2;
  let done = 0, bytes = 0;
  const store = {heb:{}, grk:{}, dict:{}};
  const tick = label => {
    done++;
    onProgress({pct:Math.round(done/total*100), msg:`${label} · ${(bytes/1048576).toFixed(1)} MB`});
  };

  for(const b of ot){
    if(ctl && ctl.stop) throw new Error("__ABORT__");
    const r = await fetch(`${HEB}/${b.src}.xml`);
    if(r.ok){ const t = await r.text(); store.heb[b.src] = t; bytes += t.length; }
    tick(b.name);
  }
  for(const b of nt){
    if(ctl && ctl.stop) throw new Error("__ABORT__");
    const r = await fetch(`${GRK}/${b.src}-morphgnt.txt`);
    if(r.ok){ const t = await r.text(); store.grk[b.src] = t; bytes += t.length; }
    tick(b.name);
  }
  for(const [k,url] of [["G",SGRK],["H",SHEB]]){
    if(ctl && ctl.stop) throw new Error("__ABORT__");
    const r = await fetch(url);
    if(r.ok){ const t = await r.text(); store.dict[k] = t; bytes += t.length; }
    tick("Kamus Strong's " + k);
  }
  if(!Object.keys(store.heb).length && !Object.keys(store.grk).length)
    throw new Error("Tidak ada berkas yang berhasil diunduh");

  onProgress({pct:99, msg:"Menyimpan…"});
  await idb("readwrite", st => st.put({
    id:SRC_KEY, data:store,
    meta:{name:"Bahasa asli (Ibrani + Yunani + Strong's)", abbr:"ASLI",
          bytes, at:Date.now(),
          books:Object.keys(store.heb).length + Object.keys(store.grk).length}
  }));
  onProgress({pct:100, msg:"Selesai"});
  return {bytes};
}

/* Muat berkas bahasa asli dari simpanan ke cache memori, supaya
   heb()/grk()/dict() memakainya tanpa jaringan. */
let origLoaded = false;
async function primeOriginals(){
  if(origLoaded) return false;
  let rec = null;
  try{ rec = await idb("readonly", st => st.get(SRC_KEY)); }catch{}
  if(!rec || !rec.data) return false;
  for(const [k,v] of Object.entries(rec.data.heb || {})) hebF.set(k,v);
  for(const [k,v] of Object.entries(rec.data.grk || {})) grkF.set(k,v);
  if(rec.data.dict?.G && !SG) SG = pd(rec.data.dict.G);
  if(rec.data.dict?.H && !SH) SH = pd(rec.data.dict.H);
  origLoaded = true;
  return true;
}
async function deleteOriginals(){
  await idb("readwrite", st => st.delete(SRC_KEY));
  hebF.clear(); grkF.clear(); ilCache.clear();
  origLoaded = false;
}

const $ = s => document.querySelector(s);
const el = (t,c,x) => { const n = document.createElement(t); if(c) n.className = c; if(x!=null) n.textContent = x; return n; };
// Palet sorot. (Stabilo isi-warna sudah tidak bisa dibuat lagi, tapi data

// isi warna sorot (transparan) diturunkan dari warna solid outline-nya
function markBg(hex){
  const h = (hex||"").replace("#","");
  if(h.length !== 6) return "transparent";
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},0.24)`;
}

      box.appendChild(el("div","sechead","Gagal memuat"));

      box.appendChild(b);

  sortedNums.forEach(n => {
    const k = vkey(n);

          for(const [txt,cls] of glossLines(w.g, w.tr)) b.appendChild(el("div",cls, txt));
          if(w.s) b.appendChild(el("div","st", w.s));
          b.onclick = () => wordCard(w);
          line.appendChild(b);
        }
        R.appendChild(line);
      }else if(n === [...nums][0]){
        R.appendChild(el("p","ilnote", ilr.msg || ""));
      }
    }
  });

  tools();
}

/* Panel bawah tidak dipakai lagi — pemilih warna sorot/stabilo kini
   di panel atas (lihat paintSwatches()). */

  $("#tools").style.display = "none";
