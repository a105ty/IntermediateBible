.original-word{color:var(--ink)}

// Incremental annotation patch: never refetch, replace, or scroll the entire chapter
// for a highlight/bookmark edit. Existing verse nodes, selections and focus remain.
function highlightColorOf(n){
 const raw=valueOf(keyOf(S.book,S.ch,n),'highlight');
 return typeof raw==='string'&&/^#[0-9a-f]{6}$/i.test(raw)?raw.toLowerCase():null;
}
function markGroupFor(color){
 const group=elt('div','mark-group');applyGroupColor(group,color);return group;
}
function applyGroupColor(group,color){
 group.style.setProperty('--mark',color);
 group.style.setProperty('--mark-bg',`color-mix(in srgb, ${color} ${S.dark?'24%':'18%'}, var(--panel))`);
}
function updateGroupJoinClasses(group){
 if(!group?.classList.contains('mark-group'))return;
 const rows=[...group.children].filter(e=>e.classList.contains('vrow'));
 for(let i=0;i<rows.length;i++){
  rows[i].classList.toggle('mjoin-top',i>0);
  rows[i].classList.toggle('mjoin-bottom',i<rows.length-1);
 }
}
function splitDiscontinuousGroup(group){
 if(!group?.classList.contains('mark-group'))return;
 const rows=[...group.children].filter(e=>e.classList.contains('vrow'));
 if(!rows.length){group.remove();return}
 let previous=Number(rows[0].id.slice(1));let current=group;
 for(const row of rows.slice(1)){
  const n=Number(row.id.slice(1));
  if(n!==previous+1){const created=markGroupFor(group.style.getPropertyValue('--mark'));current.after(created);current=created}
  if(current!==group)current.append(row);
  previous=n;
 }
 let g=group;while(g?.classList.contains('mark-group')){updateGroupJoinClasses(g);g=g.nextElementSibling}
}
function patchHighlightDom(n){
 const target=$('verses'),row=document.getElementById('v'+n);if(!target||!row)return;
 const color=highlightColorOf(n),oldGroup=row.parentElement?.classList.contains('mark-group')?row.parentElement:null;
 const prev=document.getElementById('v'+(n-1));const next=document.getElementById('v'+(n+1));
 // Detach the changed verse and repair the old group if a verse in the middle
 // was unhighlighted or recolored.
 if(oldGroup){row.remove();splitDiscontinuousGroup(oldGroup)}
 else row.remove();
 const prevContainer=prev?(prev.parentElement?.classList.contains('mark-group')?prev.parentElement:prev):null;
 const nextContainer=next?(next.parentElement?.classList.contains('mark-group')?next.parentElement:next):null;
 if(prevContainer)prevContainer.after(row);else if(nextContainer)nextContainer.before(row);else target.append(row);
 row.classList.toggle('marked',!!color);row.classList.remove('mjoin-top','mjoin-bottom');
 row.style.removeProperty('--mark');row.style.removeProperty('--mark-bg');
 if(!color){updateGroupJoinClasses(prev?.parentElement);updateGroupJoinClasses(next?.parentElement);return}
 row.style.setProperty('--mark',color);
 row.style.setProperty('--mark-bg',`color-mix(in srgb, ${color} ${S.dark?'24%':'18%'}, var(--panel))`);
 const left=prev&&highlightColorOf(n-1)===color&&prev.parentElement?.classList.contains('mark-group')?prev.parentElement:null;
 const right=next&&highlightColorOf(n+1)===color&&next.parentElement?.classList.contains('mark-group')?next.parentElement:null;
 let group;
 if(left){group=left;group.append(row)}
 else if(right){group=right;group.prepend(row)}
 else{group=markGroupFor(color);row.replaceWith(group);group.append(row)}
 if(left&&right&&left!==right){for(const item of [...right.children])left.append(item);right.remove()}
 applyGroupColor(group,color);updateGroupJoinClasses(group);
}
function patchBookmarkDom(n){

 const k=keyOf(S.book,S.ch,n);const marked=!!valueOf(k,'bookmark'),note=valueOf(k,'note');
 row.classList.toggle('pinned',marked);

 const m=q.match(/^(.*?)\s+(\d+)(?:\s*[:.]\s*(\d+))?$/);if(!m)return null;
 const normalize=t=>String(t||'').toLocaleLowerCase().replace(/[.\s\-]+/g,'');const name=normalize(m[1]);
 const b=BOOKS.find(x=>[x.id,x.name,x.en,x.zh,x.usfm].some(z=>normalize(z)===name));

}

async function initFirebase(){

 try{
  const sdk='https://www.gstatic.com/firebasejs/13.2.0';

   import(`${sdk}/firebase-app.js`),import(`${sdk}/firebase-auth.js`),import(`${sdk}/firebase-firestore.js`),import(`${sdk}/firebase-storage.js`)
  ]);

  const storage=SETTINGS.firebase.storageBucket?storageMod.getStorage(app):null;

async function subscribeFirebase(uid){if(!fb)return;const {dbMod,firestore}=fb;

  if(fb?.user?.uid!==uid)return;
  const serverKeys=new Set(), changedHighlights=new Set();let changedContent=false;
  for(const item of snap.docs){const k=item.id;serverKeys.add(k);if(!/^\w+\.\d+\.\d+$/.test(k))continue;const data=item.data();const current=S.records[k]||{};
   for(const field of ['highlight','bookmark','note','noteColor','media']){
     if(S.dirty[k]?.[field])continue;
     const before=current[field];const after=Object.hasOwn(data,field)?data[field]:undefined;
     if(JSON.stringify(before)!==JSON.stringify(after)){
       if(field==='highlight'||field==='bookmark')changedHighlights.add(k);
       else changedContent=true;
     }
     if(after!==undefined)current[field]=after;else delete current[field];
   }
   S.records[k]=current;
  }
  if(!unloadedCloud && !snap.metadata.fromCache){
   // First subscription: preserve unsynced local records when no matching cloud entry exists.
   for(const [k,r] of Object.entries(S.records))if(!serverKeys.has(k)&&Object.keys(r).length){
    S.dirty[k]={...(S.dirty[k]||{})};for(const field of Object.keys(r))S.dirty[k][field]=true;
   }
   unloadedCloud=true;
  }

  scheduleFlush();
  showSyncStatus(snap.metadata.fromCache?'Google · cache lokal':'Google · sinkronisasi aktif');
  syncPendingMedia().catch(e=>console.warn('Sync media',e));

    const patch={};for(const field of Object.keys(flags))if(S.records[k]?.[field])patch[field]=S.records[k][field];
    if(!Object.keys(patch).length){delete S.dirty[k];continue}
    const snapshot=Object.fromEntries(Object.entries(patch).map(([field,rec])=>[field,rec.at]));
    patch.updatedAt=fb.dbMod.serverTimestamp();
    const ref=fb.dbMod.doc(fb.firestore,'users',uid,'annotations',k);
    await fb.dbMod.setDoc(ref,patch,{merge:true});
    for(const [field,at] of Object.entries(snapshot)){
      if(S.records[k]?.[field]?.at===at)delete S.dirty[k]?.[field];
    }
    if(S.dirty[k]&&!Object.keys(S.dirty[k]).length)delete S.dirty[k];
    save();
  }
  showSyncStatus('Google · tersimpan ☁');
 }catch(e){showSyncStatus('Google · sync gagal',true);console.error('Sync:',e);toast('Sinkronisasi gagal: '+e.message)}finally{flushing=false;if(Object.keys(S.dirty).length&&navigator.onLine)scheduleFlush()}
}

async function blobToBase64(blob){return await new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=()=>rej(reader.error);reader.readAsDataURL(blob)})}
function base64ToBlob(data){const [header,s]=data.split(',');const mime=(header.match(/data:(.*?);/)||[])[1]||'application/octet-stream';const raw=atob(s),u=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);return new Blob([u],{type:mime})}

async function importBackup(file){if(!file)return;try{if(file.size>30*1024*1024)throw new Error('Maksimum berkas backup 30 MB');const payload=JSON.parse(await file.text());let added=0;
 if(payload.format==='IntermediateBible-Firebase-v1'&&payload.records){for(const [k,r] of Object.entries(payload.records)){
  if(!/^\w+\.\d+\.\d+$/.test(k)||!r||typeof r!=='object')continue;
  for(const field of ['highlight','bookmark','note','noteColor','media'])if(Object.hasOwn(r,field)){recordChanged(k,field,r[field]?.value??null);added++}
 }

const ESV_WORKER_TEMPLATE=`// Cloudflare Worker: simpan ESV_KEY sebagai Secret (bukan di HTML).
// Atur ALLOWED_ORIGIN (Variable) = https://domain-situsmu.com
// Untuk uji lokal: ALLOWED_ORIGIN = http://localhost:8000
export default {
 async fetch(request,env){
  const origin=request.headers.get('Origin')||'';
  const allowed=(env.ALLOWED_ORIGIN||'').split(',').map(x=>x.trim());
  const ok=allowed.includes(origin);
  const headers={'Content-Type':'application/json; charset=utf-8',
   'Access-Control-Allow-Origin':ok?origin:'',
   'Access-Control-Allow-Headers':'Content-Type',
   'Access-Control-Allow-Methods':'GET, OPTIONS','Vary':'Origin',
   'Cache-Control':'no-store'};
  if(request.method==='OPTIONS')return new Response(null,{status:ok?204:403,headers});
  if(!ok)return new Response(JSON.stringify({error:'Origin tidak diizinkan'}),{status:403,headers});
  const url=new URL(request.url);
  if(url.pathname!=='/esv'||request.method!=='GET')return new Response(JSON.stringify({error:'Not found'}),{status:404,headers});
  const q=(url.searchParams.get('q')||'').trim();
  if(!/^[1-3]? ?[A-Za-z ]{2,40} +[0-9]{1,3}$/.test(q))return new Response(JSON.stringify({error:'Referensi tidak valid'}),{status:400,headers});
  const key=env.ESV_KEY||env.ESV_API_KEY;
  if(!key)return new Response(JSON.stringify({error:'ESV_KEY belum disetel'}),{status:503,headers});
  const api=new URL('https://api.esv.org/v3/passage/text/');
  for(const [k,v] of Object.entries({'q':q,'include-headings':'false',
   'include-passage-references':'false','include-footnotes':'false',
   'include-verse-numbers':'true','include-first-verse-numbers':'true',
   'include-short-copyright':'false','include-copyright':'false','line-length':'0'}))api.searchParams.set(k,v);
  const remote=await fetch(api.toString(),{headers:{Authorization:'Token '+key}});
  const text=await remote.text();
  return new Response(text,{status:remote.status,headers});
 }
};`;

function runSelfTests(){const cases=[
 ['Kata , berikut', 'Kata, berikut'],['Firman,itu', 'Firman, itu'],['Yohanes 3:16', 'Yohanes 3:16'],
 ['Lalu“berkata”', 'Lalu “berkata”'],['3.14', '3.14'],['Air ; kemudian', 'Air; kemudian'],
 ['Ia ( pergi )', 'Ia (pergi)']];
 const errors=[];for(const [input,expected] of cases){const actual=cleanPunctuation(input);if(actual!==expected)errors.push({input,expected,actual})}
 const v=joinVerseFragments(['Pada mulanya,',{text:' Allah'},',menciptakan',' langit','.']);
 if(v!=='Pada mulanya, Allah, menciptakan langit.')errors.push({case:'fragments',actual:v});
 const source='Tuhan berkata: “Jadilah terang!” (Kej. 1:3)';
 if(providerVerseText({text:source})!==source)errors.push({case:'provider text changed'});
 const demo=parseNltHtml('<verse_export vn="16"><p><span class="vn">16</span>For God <a class="a-tn">*</a><span class="tn">Note</span> loved.</p></verse_export>');
 if(demo.get(16)!=='For God loved.')errors.push({case:'NLT parser',actual:demo.get(16)});
 return {passed:cases.length+3-errors.length,failed:errors.length,errors};
}
