/* ---------- kartu kata bahasa asli ---------- */
function wordCard(w){
  const grk    = !!(w.s && w.s[0] === "G") || !!w.pos;
  const d      = grk ? SG : SH;
  const e      = (d && w.s) ? d[w.s] : null;
  const lemTr  = e ? (e.translit || e.xlit || "") : "";
  const lemma  = w.l || (e && e.lemma) || "";
  const surfTr = w.tr || "";
  const morf   = grk ? morfGrk(w.pos, w.ps) : morfHeb(w.mp);
  const rawMor = grk ? [w.pos, w.ps].filter(Boolean).join(" ") : (w.mp || "");
  ov(w.o, box => {
    // 1) yang benar-benar tertulis di ayat
    box.appendChild(el("div","sechead","Kata dalam ayat"));
    box.appendChild(el("div","bigword", w.o));
    if(surfTr) box.appendChild(el("p","hint", surfTr));
    if(morf)   box.appendChild(el("p","hint", morf));
    if(rawMor) box.appendChild(el("p","hint","Kode morfologi: " + rawMor));

    // 2) bentuk kamusnya — arti di bawah selalu arti bentuk ini
    box.appendChild(el("div","sechead","Bentuk dasar (kamus)"));
    box.appendChild(el("div","bigword", lemma || "—"));
    if(lemTr) box.appendChild(el("p","hint", lemTr));
    if(lemma && lemma !== w.o)
      box.appendChild(el("p","hint","Kata di ayat adalah bentuk turunan dari kata dasar ini, jadi arti di bawah adalah arti kata dasarnya."));

    box.appendChild(el("div","sechead","Nomor Strong's"));
    box.appendChild(el("p","hint", w.s || "—"));
    if(e){
      if(e.strongs_def){ box.appendChild(el("div","sechead","Definisi Strong's")); box.appendChild(el("p","hint", e.strongs_def.replace(/\s+/g," ").trim())); }
      if(e.kjv_def){ box.appendChild(el("div","sechead","Diterjemahkan sebagai (KJV)")); box.appendChild(el("p","hint", e.kjv_def.replace(/\s+/g," ").trim())); }
      if(e.derivation){ box.appendChild(el("div","sechead","Asal kata")); box.appendChild(el("p","hint", e.derivation.replace(/\s+/g," ").trim())); }
    }else{
      box.appendChild(el("p","hint","Kata ini tidak terpetakan ke entri Strong's, jadi hanya bentuk dan morfologinya yang tersedia."));
    }
    box.appendChild(el("p","hint","Transliterasi kata dalam ayat dihitung sendiri oleh aplikasi (perkiraan, mengikuti tanda baca naskah). Transliterasi bentuk dasar berasal dari kamus Strong's."));
  });
}

/* ---------- ketuk = sorot; ketuk & tahan = bookmark ----------
   Menandai hanya aktif saat pemilih warna (tombol 🎨) terbuka: buka 🎨 →
   ketuk ayat-ayatnya → tutup 🎨 lagi untuk mengunci. Selama tertutup,
   ketukan di ayat tidak mengubah apa pun.
   Saat aktif, ketuk sekali menandai/melepas SOROT (outline tegas + isi
   tipis) memakai warna yang sedang dipilih (S.sorotColor). Bisa ketuk
   berturut-turut di beberapa ayat untuk menandai satu bagian sekaligus.
   Tahan ~500 ms memasang/melepas pin (bookmark).
   Catatan TIDAK lewat ketuk di ayat: menulis, mengubah, dan menghapus
   catatan semuanya dari tombol 📑 di atas.
   Ditangani lewat pointer events supaya jalan di sentuh maupun tetikus,
   dan gerakan jari > 10 px dianggap menggulir, bukan menekan. */
const MARK_DEFAULT = MARK[0][1]; // kuning — warna sorot bawaan
if(!S.sorotColor) S.sorotColor = MARK_DEFAULT;
/* Ayat berurutan yang isi catatannya sama dianggap satu catatan — supaya
   membukanya lewat penanda ✎ tidak memecah catatan itu saat disimpan. */
function noteRangeFor(n){
  const txt = S.notes[vkey(n)];
  if(!txt) return [n];
  let a = n, b = n;
  while(a > 1 && S.notes[vkey(a-1)] === txt) a--;
  while(S.notes[vkey(b+1)] === txt) b++;
  const out = [];
  for(let v = a; v <= b; v++) out.push(v);
  return out;
}
function attachPress(node, n, k){
  let timer = null, fired = false, sx = 0, sy = 0;
  const clear = () => { clearTimeout(timer); timer = null; };
  node.addEventListener("pointerdown", e => {
    fired = false; sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => {
      fired = true;
      if(S.pin[k]) delete S.pin[k]; else S.pin[k] = Date.now();
      persist();
      if(navigator.vibrate) try{ navigator.vibrate(18); }catch{}
      toast(S.pin[k] ? "Bookmark dipasang" : "Bookmark dilepas");
      render();
    }, 500);
  });
  node.addEventListener("pointermove", e => {
    if(timer && (Math.abs(e.clientX-sx) > 10 || Math.abs(e.clientY-sy) > 10)) clear();
  });
  node.addEventListener("pointerup", () => {
    clear();
    if(fired) return;
    // Mode menandai hanya hidup selama pemilih warna (🎨) terbuka. Kalau
    // tertutup, ketukan di ayat diabaikan — supaya ayat tidak ikut berwarna
    // hanya karena tersenggol saat membaca atau menggulir.
    if(!S.swatchOpen) return;
    if(S.mark[k] || S.stab[k]){
      // lepas tanda apa pun yang ada — termasuk stabilo lama dari versi
      // sebelumnya, supaya tanda itu tetap bisa dihapus
      delete S.mark[k]; delete S.stab[k];
    }else S.mark[k] = S.sorotColor;
    persist();
    if(navigator.vibrate) try{ navigator.vibrate(12); }catch{}
    render();
  });
  node.addEventListener("pointercancel", clear);
  node.addEventListener("contextmenu", e => { if(fired) e.preventDefault(); });
}

/* ---------- perkecil foto sebelum disimpan ----------
   Foto kamera ponsel bisa 3–8 MB; kalau disimpan apa adanya, kuota
   IndexedDB cepat penuh. Diperkecil ke sisi terpanjang 1600 px dan
   JPEG mutu 0.82 — masih jelas dibaca tapi jauh lebih ringan. Kalau
   gagal (format tak didukung), berkas aslinya yang dipakai. */
function shrinkImage(file, maxPx){
  return new Promise(res => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const s = Math.min(1, maxPx / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        cv.toBlob(bl => { URL.revokeObjectURL(url); res(bl || file); }, "image/jpeg", 0.82);
      }catch{ URL.revokeObjectURL(url); res(file); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

/* ---------- editor catatan ----------
   Dibuka dari tombol 📑 (daftar catatan) — bukan dari ketukan di ayat.
   Bisa dipakai untuk pasal mana pun: daftar nomor ayat diambil dari
   terjemahan kolom pertama, jadi mengubah catatan kitab lain tetap
   menampilkan pilihan ayat yang benar.
   Satu catatan teks bisa ditempelkan ke beberapa ayat berurutan.
   Lampiran foto/audio selalu menempel pada SATU ayat jangkar (ayat
   paling awal saat kartu dibuka) supaya tidak terduplikasi ke seluruh
   rentang ayat. */
function noteEditor(bookId, ch, verses){
  const b = bk(bookId); if(!b) return;
  // Jangkar TIDAK lagi ditentukan otomatis dari ayat pertama pasal.
  // Kalau dipanggil tanpa ayat (catatan baru), jangkar baru terpasang
  // begitu pengguna benar-benar mengetuk sebuah ayat di kartu ini —
  // sekali terpasang, jangkar tidak berubah lagi selama kartu terbuka.
  let anchor = verses.length ? Math.min(...verses) : null;
  const akey = () => anchor === null ? null : mkey(bookId, ch, anchor);
  const selected = new Set(verses);
  let nums = verses.slice().sort((x,y) => x-y);

  ov(`Catatan — ${b.name} ${ch}`, box => {
    box.appendChild(el("div","sechead","Ayat — ketuk untuk memilih (ayat pertama yang diketuk jadi jangkar)"));
    const g = el("div","grid-c");
    box.appendChild(g);
    const gnote = el("p","hint","Memuat daftar ayat…");
    box.appendChild(gnote);

    box.appendChild(el("div","sechead","Catatan"));
    const ta = el("textarea","note");
    ta.placeholder = "Tulis renungan atau pertanyaan…";
    ta.value = anchor === null ? "" : (S.notes[akey()] || "");
    box.appendChild(ta);

    box.appendChild(el("div","tlabel","Warna catatan"));
    const ncRow = el("div","swrow");
    box.appendChild(ncRow);
    let noteColor = anchor === null ? null : (S.noteColor[akey()] || null);
    function paintNoteColor(){
      ncRow.innerHTML = "";
      const none = el("button","swatch none" + (!noteColor ? " on" : ""), "✕");
      none.title = "Tanpa warna";
      none.onclick = () => { noteColor = null; paintNoteColor(); };
      ncRow.appendChild(none);
      MARK.forEach(([name,color]) => {
        const sw = el("button","swatch" + (noteColor === color ? " on" : ""));
        sw.title = name;
        sw.style.background = color;
        sw.onclick = () => { noteColor = color; paintNoteColor(); };
        ncRow.appendChild(sw);
      });
    }
    paintNoteColor();

    const lampHead = el("div","sechead", anchor === null ? "Lampiran — pilih ayat dulu" : `Lampiran — ayat ${anchor}`);
    box.appendChild(lampHead);
    const mlist = el("div");
    box.appendChild(mlist);

    const mrow = el("div","trow");
    const fin = el("input"); fin.type = "file"; fin.accept = "image/*"; fin.style.display = "none";
    fin.onchange = async e => {
      const f = e.target.files && e.target.files[0];
      e.target.value = "";
      if(!f || anchor === null) return;
      try{
        const blob = await shrinkImage(f, 1600);
        await mediaPut(akey(), "photo", blob);
        paintMedia(); paintGrid(); toast("Foto dilampirkan");
      }catch{ toast("Foto gagal dilampirkan"); }
    };
    const ph = el("button","btn ghost","🖼 Tambah foto");
    ph.onclick = () => { if(anchor === null){ toast("Pilih ayat dulu"); return; } fin.click(); };
    mrow.appendChild(ph); mrow.appendChild(fin);
    const recBtn = el("button","btn ghost","🎤 Rekam suara");
    mrow.appendChild(recBtn);
    box.appendChild(mrow);

    const recBox = el("div"); recBox.style.marginTop = "8px";
    box.appendChild(recBox);

    let mr = null, chunks = [], tick = null, t0 = 0;
    function stopRec(){
      if(tick){ clearInterval(tick); tick = null; }
      if(mr && mr.state !== "inactive"){ try{ mr.stop(); }catch{} }
    }
    recBtn.onclick = async () => {
      if(anchor === null){ toast("Pilih ayat dulu"); return; }
      if(mr && mr.state === "recording"){ stopRec(); return; }
      recBox.innerHTML = "";
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined"){
        recBox.appendChild(el("p","hint","Perekaman suara tidak tersedia di sini. Mikrofon hanya bisa dipakai lewat https:// atau localhost — kalau berkas ini dibuka langsung sebagai file://, peramban memblokirnya."));
        return;
      }
      let stream;
      try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
      catch(err){
        recBox.appendChild(el("p","hint","Mikrofon tidak bisa dipakai (" + ((err && err.name) || "ditolak") + "). Izinkan akses mikrofon lalu coba lagi."));
        return;
      }
      chunks = [];
      try{ mr = new MediaRecorder(stream); }
      catch{
        stream.getTracks().forEach(t => t.stop());
        recBox.appendChild(el("p","hint","Perekam suara gagal dimulai di peramban ini."));
        return;
      }
      mr.ondataavailable = ev => { if(ev.data && ev.data.size) chunks.push(ev.data); };
      mr.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        recBtn.textContent = "🎤 Rekam suara";
        recBox.innerHTML = "";
        const mime = mr.mimeType || "audio/webm";
        const blob = new Blob(chunks, {type:mime});
        mr = null;
        if(!blob.size){ toast("Rekaman kosong"); return; }
        try{ await mediaPut(akey(), "audio", blob); paintMedia(); paintGrid(); toast("Rekaman disimpan"); }
        catch{ toast("Rekaman gagal disimpan"); }
      };
      mr.start();
      t0 = Date.now();
      recBtn.textContent = "⏹ Selesai merekam";
      const line = el("div","rec");
      line.appendChild(el("span","recdot"));
      const lab = el("span","hint","Merekam… 0:00");
      line.appendChild(lab);
      recBox.appendChild(line);
      tick = setInterval(() => {
        const s = Math.floor((Date.now()-t0)/1000);
        lab.textContent = `Merekam… ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
        if(s >= 300) stopRec();   // batas 5 menit supaya berkas tidak membengkak
      }, 500);
    };

    const row = el("div","trow");
    const sv = el("button","btn","Simpan");
    row.appendChild(sv);
    const cp = el("button","btn ghost","Salin ayat");
    cp.onclick = async () => {
      if(anchor === null){ toast("Pilih ayat dulu"); return; }
      const d = await getCh(S.cols[0], bookId, ch);
      if(d.ok && d.m.has(anchor)){
        const t = `"${d.m.get(anchor)}" — ${b.name} ${ch}:${anchor} (${VER[S.cols[0]].abbr})`;
        try{ await navigator.clipboard.writeText(t); toast("Ayat disalin"); }
        catch{ toast("Peramban menolak akses papan klip"); }
      }else toast("Teks ayat belum termuat");
    };
    row.appendChild(cp);
    const dl = el("button","btn warn","Hapus catatan");
    row.appendChild(dl);
    box.appendChild(row);

    function paintGrid(){
      g.innerHTML = "";
      nums.forEach(v => {
        const btn = el("button","chapbtn" + (selected.has(v) ? " on" : ""), v);
        btn.onclick = () => {
          const prevAnchor = anchor;
          if(selected.has(v)){
            if(v === anchor){
              // ayat jangkar cuma dikunci kalau sudah ada lampiran menempel
              // (lampiran menempel ke satu ayat tetap) — kalau belum ada
              // lampiran, boleh dilepas dan jangkar pindah ke ayat lain
              if(mediaCount(akey()) > 0){
                toast("Ayat ini punya lampiran — hapus lampirannya dulu untuk melepasnya");
                return;
              }
              selected.delete(v);
              anchor = selected.size ? Math.min(...selected) : null;
            }else{
              selected.delete(v);
            }
          }else{
            selected.add(v);
            if(anchor === null) anchor = v;   // ayat pertama yang diketuk jadi jangkar
          }
          paintGrid();
          if(anchor !== prevAnchor){
            // jangkar berubah (baru terpasang, dilepas, atau pindah) — muat
            // catatan/lampiran/warna ayat itu, tanpa menimpa ketikan lain di luar sini
            ta.value = anchor === null ? "" : (S.notes[akey()] || "");
            noteColor = anchor === null ? null : (S.noteColor[akey()] || null);
            paintNoteColor();
            lampHead.textContent = anchor === null ? "Lampiran — pilih ayat dulu" : `Lampiran — ayat ${anchor}`;
            paintMedia();
          }
        };
        g.appendChild(btn);
      });
      const k = akey();
      const ada = [...selected].some(v => S.notes[mkey(bookId,ch,v)]) || (k !== null && mediaCount(k) > 0);
      dl.style.display = ada ? "" : "none";
    }

    async function paintMedia(){
      freeOvURLs();          // buang URL pratinjau lama sebelum menggambar ulang
      mlist.innerHTML = "";
      const k = akey();
      const items = k === null ? [] : (S.media[k] || []).slice().sort((x,y) => x.at - y.at);
      if(!items.length){
        mlist.appendChild(el("p","hint", k === null
          ? "Pilih ayat dulu untuk melampirkan foto atau rekaman."
          : "Belum ada lampiran. Tersimpan di perangkat ini, dan ikut tersinkron ke akun bila kamu masuk."));
        return;
      }
      const photos = el("div","mgrid");
      mlist.appendChild(photos);
      for(const it of items){
        const rec = await mediaGet(it.id);
        if(!rec || !rec.blob){
          // indeks menyebut ada berkas tapi isinya hilang (mis. basis data
          // dibersihkan peramban) — rapikan indeksnya, jangan tampilkan kosong
          await mediaDel(k, it.id);
          continue;
        }
        const url = URL.createObjectURL(rec.blob);
        ovURLs.push(url);
        if(it.type === "photo"){
          const th = el("div","mthumb");
          const im = el("img"); im.src = url; im.alt = "Foto catatan";
          im.onclick = () => window.open(url, "_blank");
          th.appendChild(im);
          const x = el("button","mdel","✕");
          x.title = "Hapus foto";
          x.onclick = async () => { await mediaDel(k, it.id); paintMedia(); paintGrid(); render(); };
          th.appendChild(x);
          photos.appendChild(th);
        }else{
          const ar = el("div","arow");
          const au = el("audio"); au.controls = true; au.src = url; au.preload = "metadata";
          ar.appendChild(au);
          const x = el("button","adel","🗑");
          x.title = "Hapus rekaman";
          x.onclick = async () => { await mediaDel(k, it.id); paintMedia(); paintGrid(); render(); };
          ar.appendChild(x);
          mlist.appendChild(ar);
        }
      }
    }

    sv.onclick = () => {
      if(!selected.size){ toast("Pilih ayat dulu"); return; }
      stopRec();
      const t = ta.value.trim();
      [...selected].forEach(v => {
        const vk = mkey(bookId, ch, v);
        if(t) S.notes[vk] = t; else delete S.notes[vk];
        const adaIsi = t || mediaCount(vk) > 0;
        if(adaIsi && noteColor) S.noteColor[vk] = noteColor; else delete S.noteColor[vk];
      });
      persist(); closeOv();
      toast(t ? "Catatan disimpan" : "Catatan teks dihapus");
      render();
    };
    dl.onclick = async () => {
      if(anchor === null) return;
      const k = akey();
      const nMedia = mediaCount(k);
      if(!confirm(nMedia ? `Hapus catatan ini beserta ${nMedia} lampirannya?` : "Hapus catatan ini?")) return;
      stopRec();
      [...selected].forEach(v => { delete S.notes[mkey(bookId, ch, v)]; delete S.noteColor[mkey(bookId, ch, v)]; });
      await mediaDelAllFor(k);
      persist(); closeOv(); toast("Catatan dihapus"); render();
    };

    paintGrid();
    paintMedia();

    // Ambil daftar nomor ayat sebenarnya dari terjemahan supaya bisa
    // memilih ayat lain di pasal ini — termasuk saat mengubah catatan
    // yang ada di kitab/pasal selain yang sedang dibaca.
    getCh(S.cols[0], bookId, ch).then(d => {
      if(d.ok && d.m.size){
        nums = [...new Set([...d.m.keys(), ...verses])].sort((x,y) => x-y);
        gnote.textContent = "";
        paintGrid();
      }else{
        gnote.textContent = "Daftar ayat pasal ini gagal dimuat; hanya ayat catatan ini yang bisa dipilih.";
      }
    }).catch(() => { gnote.textContent = ""; });
  });
}

/* =========================================================
   OVERLAY
   ========================================================= */
/* URL sementara untuk pratinjau foto/audio. Blob URL tidak dilepas
   sendiri oleh peramban, jadi dicatat di sini dan dibebaskan begitu
   overlay ditutup atau diganti — kalau tidak, memori terus bertambah
   setiap kali kartu catatan dibuka. */
let ovURLs = [];
function freeOvURLs(){
  ovURLs.forEach(u => { try{ URL.revokeObjectURL(u); }catch{} });
  ovURLs = [];
}
function ov(title, build){
  freeOvURLs();
  const box = $("#ovbox"); box.innerHTML = "";
  const h = el("div","ovhead");
  h.appendChild(el("h2","ovtitle", title));
  const x = el("button","icobtn","✕"); x.onclick = closeOv;
  h.appendChild(x); box.appendChild(h);
  build(box);
  $("#ov").classList.add("on");
}
function closeOv(){ $("#ov").classList.remove("on"); freeOvURLs(); }
$("#ov").onclick = e => { if(e.target.id === "ov") closeOv(); };
document.addEventListener("keydown", e => { if(e.key === "Escape") closeOv(); });
function toast(t){
  const n = el("div","toast", t);
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 2100);
}

/* ---------- pilih / cari versi ---------- */
let swapTarget = null;
function swapCol(i){ swapTarget = i; versionPicker(); }

function versionPicker(){
  ov(swapTarget != null ? "Ganti versi kolom " + (swapTarget+1) : "Versi terjemahan", box => {
    const q = el("input","srch");
    q.type = "search";
    q.placeholder = "Ketik bahasa — mis. Indonesian, Chinese, French, Javanese";
    box.appendChild(q);

    const hint = el("p","hint","");
    box.appendChild(hint);

    const listed = el("div"); listed.style.marginTop = "10px";
    box.appendChild(listed);

    function pick(id, meta){
      if(meta) VER[id] = meta;
      if(swapTarget != null){ S.cols[swapTarget] = id; swapTarget = null; }
      else if(!S.cols.includes(id)) S.cols.push(id);
      persist(); chips(); render(); closeOv();
      toast((VER[id].abbr || id) + " dipakai");
    }

    function drawInstalled(){
      listed.innerHTML = "";
      listed.appendChild(el("div","sechead","Terpasang"));
      Object.keys(VER).forEach(id => {
        const v = VER[id];
        const b = el("button","res" + (S.cols.includes(id) ? " on" : ""));
        const t = el("div","t");
        const noKey = v.api && !apiKey(v.api);
        t.appendChild(el("b", null, v.name + (v.broken ? " — ID tidak berlaku" : "")));
        t.appendChild(el("i", null, `${v.lang} · ${id}`
          + (v.api ? (noKey ? " · perlu kunci API (⚙)" : " · lewat API penerbit") : "")));
        b.appendChild(t);
        b.appendChild(el("span","tag" + (v.books === 66 ? " full" : ""), (v.books || "?") + " kitab"));
        b.onclick = () => {
          if(v.broken){ toast("ID ini tidak ada di server"); return; }
          if(swapTarget == null && S.cols.includes(id)){
            if(S.cols.length === 1){ toast("Sisakan minimal satu versi"); return; }
            S.cols = S.cols.filter(c => c !== id);
            persist(); chips(); render(); drawInstalled();
            return;
          }
          pick(id);
        };
        listed.appendChild(b);
      });
      hint.textContent = S.catState === "ok"
        ? `Katalog siap: ${S.catalog.length} versi. Ketik nama bahasa untuk menelusuri.`
        : S.catState === "loading" ? "Memuat katalog…"
        : S.catState === "err" ? "Katalog gagal dimuat — versi terpasang tetap bisa dipakai."
        : "";
    }

    function drawSearch(){
      const s = q.value.trim().toLowerCase();
      if(!s){ drawInstalled(); return; }
      if(!S.catalog){ hint.textContent = "Katalog belum siap."; return; }
      listed.innerHTML = "";

      // kelompokkan per bahasa supaya "isi nama bahasa -> muncul versinya"
      const hits = S.catalog.filter(t =>
        (t.lang||"").toLowerCase().includes(s) ||
        (t.native||"").toLowerCase().includes(s) ||
        (t.name||"").toLowerCase().includes(s) ||
        (t.en||"").toLowerCase().includes(s) ||
        (t.id||"").toLowerCase().includes(s));
      if(!hits.length){ hint.textContent = "Tidak ada yang cocok."; return; }

      const byLang = new Map();
      hits.forEach(t => {
        const L = t.lang || "—";
        if(!byLang.has(L)) byLang.set(L,[]);
        byLang.get(L).push(t);
      });
      hint.textContent = `${hits.length} versi dalam ${byLang.size} bahasa.`;

      [...byLang.entries()].sort((a,b) => b[1].length - a[1].length).forEach(([L,arr]) => {
        listed.appendChild(el("div","sechead", `${L} — ${arr.length} versi`));
        arr.sort((a,b) => b.books - a.books).slice(0,40).forEach(t => {
          const b = el("button","res" + (S.cols.includes(t.id) ? " on" : ""));
          const d = el("div","t");
          d.appendChild(el("b", null, t.name));
          d.appendChild(el("i", null, `${t.en || t.lang} · ${t.id}`));
          b.appendChild(d);
          b.appendChild(el("span","tag" + (t.books === 66 ? " full" : ""), t.books + " kitab"));
          b.onclick = () => pick(t.id, {
            id:t.id, name:t.name, abbr:t.abbr, lang:t.lang,
            books:t.books, cjk:t.cjk, rtl:t.rtl
          });
          listed.appendChild(b);
        });
      });
    }

    q.oninput = drawSearch;
    drawInstalled();
    loadCatalog().then(drawInstalled);
    setTimeout(() => q.focus(), 120);
  });
}

async function loadCatalog(){
  if(S.catState === "ok" || S.catState === "loading") return;
  S.catState = "loading";
  try{
    const r = await fetch(`${AO}/available_translations.json`);
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    S.catalog = (j.translations || []).map(t => ({
      id:t.id, name:t.name, abbr:t.shortName || t.id,
      lang:t.languageEnglishName || t.language, native:t.languageName,
      en:t.englishName, books:t.numberOfBooks,
      rtl:t.textDirection === "rtl",
      cjk:/chinese|japanese|korean/i.test(t.languageEnglishName || "")
    }));
    S.catState = "ok";
  }catch(e){ S.catState = "err"; console.error("katalog:", e.message); }
}

/* ---------- daftar catatan ----------
   SATU-SATUNYA tempat mengelola catatan: menulis baru, mengubah, dan
   menghapus. Ketukan di ayat tidak lagi membuka editor — supaya tidak
   ada dua jalur yang membingungkan.
   Ayat-ayat berurutan dengan isi catatan PERSIS sama digabung jadi satu
   baris ("10:8–10"); mengetuk baris itu mengarahkan ke ayat PERTAMA-nya
   dan langsung menggulir ke sana. Ayat yang punya lampiran foto/audio
   ditampilkan sendiri, tidak digabung, karena lampirannya menempel pada
   ayat tertentu. */
function noteList(){
  ov("Catatan", box => {
    const nw = el("div","trow");
    const add = el("button","btn","✎ Tulis catatan baru");
    add.onclick = () => {
      noteEditor(S.book, S.ch, []);
    };
    nw.appendChild(add);
    box.appendChild(nw);
    box.appendChild(el("p","hint", `Catatan baru dibuat untuk ${cur().name} ${S.ch} — pilih ayatnya di kartu berikutnya.`));

    // ayat dianggap punya catatan bila ada teksnya ATAU ada lampirannya
    const keys = [...new Set([...Object.keys(S.notes), ...Object.keys(S.media)])];
    if(!keys.length){
      box.appendChild(el("div","sechead","Tersimpan"));
      box.appendChild(el("p","hint","Belum ada catatan."));
      return;
    }
    const parsed = keys.map(k => {
      const [b,c,v] = k.split(".");
      return {k, b, c:+c, v:+v};
    }).filter(x => bk(x.b) && Number.isFinite(x.c) && Number.isFinite(x.v));
    parsed.sort((a,b) => {
      const ia = BOOKS.findIndex(x => x.id === a.b), ib = BOOKS.findIndex(x => x.id === b.b);
      return ia - ib || a.c - b.c || a.v - b.v;
    });

    const groups = [];
    parsed.forEach(p => {
      const last = groups[groups.length-1];
      const canJoin = last
        && last.b === p.b && last.c === p.c && p.v === last.vEnd + 1
        && S.notes[last.k] && S.notes[p.k] && S.notes[last.k] === S.notes[p.k]
        && (S.noteColor[last.k]||null) === (S.noteColor[p.k]||null)
        && !mediaCount(last.k) && !mediaCount(p.k);
      if(canJoin) last.vEnd = p.v;
      else groups.push({k:p.k, b:p.b, c:p.c, vStart:p.v, vEnd:p.v});
    });

    box.appendChild(el("div","sechead", `Tersimpan — ${groups.length} catatan`));
    groups.forEach(g => {
      const bb = bk(g.b); if(!bb) return;
      const verses = [];
      for(let v = g.vStart; v <= g.vEnd; v++) verses.push(v);

      const r = el("div","res rowbox");
      if(S.noteColor[g.k]){
        r.style.borderLeft = `5px solid ${S.noteColor[g.k]}`;
        r.style.background = markBg(S.noteColor[g.k]);
      }
      const t = el("div","t tap");
      const ref = g.vStart === g.vEnd
        ? `${bb.name} ${g.c}:${g.vStart}`
        : `${bb.name} ${g.c}:${g.vStart}–${g.vEnd}`;
      const ms = S.media[g.k] || [];
      const np = ms.filter(x => x.type === "photo").length;
      const na = ms.filter(x => x.type === "audio").length;
      const tail = (np ? ` 🖼${np}` : "") + (na ? ` 🎤${na}` : "");
      t.appendChild(el("b", null, ref + tail));
      if(S.noteColor[g.k]){
        const dot = el("span"); dot.textContent = "●";
        dot.style.cssText = `color:${S.noteColor[g.k]};margin-left:6px;font-size:11px`;
        t.firstChild.appendChild(dot);
      }
      const txt = S.notes[g.k];
      t.appendChild(el("i", null, txt ? txt.slice(0,80) : "(hanya lampiran)"));
      t.onclick = () => jumpTo(g.b, g.c, g.vStart, false);
      r.appendChild(t);

      const acts = el("div","acts");
      const ed = el("button","icobtn","✎");
      ed.title = "Ubah catatan ini";
      ed.onclick = () => noteEditor(g.b, g.c, verses);
      acts.appendChild(ed);
      const rm = el("button","icobtn","🗑");
      rm.title = "Hapus catatan ini";
      rm.onclick = async () => {
        const n = mediaCount(g.k);
        if(!confirm(n ? `Hapus catatan ${ref} beserta ${n} lampirannya?` : `Hapus catatan ${ref}?`)) return;
        verses.forEach(v => delete S.notes[mkey(g.b, g.c, v)]);
        await mediaDelAllFor(g.k);
        persist(); render();
        noteList();               // gambar ulang daftarnya
        toast("Catatan dihapus");
      };
      acts.appendChild(rm);
      r.appendChild(acts);

      box.appendChild(r);
    });
  });
}

      const up = el("button","btn","Unggah sekarang");

      row.appendChild(up);
      const dn = el("button","btn ghost","Ambil dari server");

      row.appendChild(dn);

      row.appendChild(out);
      box.appendChild(row);
    }else{
      box.appendChild(el("label","fld","Email"));
      const em = el("input","inp"); em.type = "email"; em.placeholder = "nama@email.com";
      box.appendChild(em);
      box.appendChild(el("label","fld","Kata sandi"));
      const pw = el("input","inp"); pw.type = "password"; pw.placeholder = "minimal 6 karakter";
      box.appendChild(pw);
      const msg = el("p","hint","");
      const row = el("div","trow");
      const go = async (mode) => {
        const e = em.value.trim(), p = pw.value;
        if(!e || p.length < 6){ msg.textContent = "Isi email dan kata sandi (minimal 6 karakter)."; return; }
        msg.textContent = "Menghubungi server…";
        const local = location.protocol !== "http:" && location.protocol !== "https:";
        const opts = local ? {} : {emailRedirectTo: location.href.split("#")[0]};
        const fn = mode === "in"
          ? sb.auth.signInWithPassword({email:e, password:p})
          : sb.auth.signUp({email:e, password:p, options:opts});
        const {data, error} = await fn;
        if(error){
          const m = (error.message||"").toLowerCase();
          msg.textContent = m.includes("not confirmed")
            ? "Email belum dikonfirmasi. Matikan 'Confirm email' di Supabase (Authentication → Providers → Email), lalu coba masuk lagi."
            : "Gagal: " + error.message;
          return;
        }
        if(mode === "up"){
          msg.textContent = data && data.session
            ? "Akun dibuat dan langsung masuk."
            : "Akun dibuat, tapi Supabase masih meminta konfirmasi email. Matikan 'Confirm email' di Authentication → Providers → Email, lalu tekan Masuk.";
          if(data && data.session){ closeOv(); toast("Akun dibuat"); }
          return;
        }
        msg.textContent = "Berhasil masuk.";
        closeOv(); toast("Berhasil masuk");
      };
      const b1 = el("button","btn","Masuk"); b1.onclick = () => go("in");
      const b2 = el("button","btn ghost","Daftar akun baru"); b2.onclick = () => go("up");
      row.appendChild(b1); row.appendChild(b2);
      box.appendChild(row);
      box.appendChild(msg);
    }
    box.appendChild(el("div","sechead","Status sinkronisasi"));
    const dl = el("div");
    box.appendChild(dl);
    if(S.user) runDiag(dl);
    else dl.appendChild(el("p","hint","Masuk untuk memeriksa status sinkronisasi."));
  });
}

/* =========================================================
   RENUNGAN HARIAN
   Tiap hari: 1 pasal PL (urut), 1 pasal PB (urut), 1 pasal Amsal.
   Amsal mengikuti tanggal (1–31) — kebiasaan baca Amsal yang umum.
   PL & PB berjalan urut dari Kejadian / Matius dan berulang setelah
   selesai. Titik awal siklus = 1 Januari 2026.
   ========================================================= */
const PLAN_EPOCH = Date.UTC(2026,0,1);
function flatten(list){
  const o = [];
  for(const b of list) for(let c=1;c<=b.ch;c++) o.push([b.id,c]);
  return o;
}
let OTF=null, NTF=null;
function planLists(){
  if(!OTF){
    OTF = flatten(BOOKS.filter(b => b.t === "PL" && b.id !== "ams"));
    NTF = flatten(BOOKS.filter(b => b.t === "PB"));
  }
  return [OTF,NTF];
}
function dayIndex(d){
  return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - PLAN_EPOCH) / 86400000);
}
function planFor(d){
  const [ot,nt] = planLists();
  const i = dayIndex(d);
  const wrap = (arr,n) => arr[((n % arr.length) + arr.length) % arr.length];
  return {
    ot: wrap(ot,i),
    nt: wrap(nt,i),
    am: ["ams", Math.min(d.getDate(), 31)],
    idx: i
  };
}
function planKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function planPicker(){
  const today = new Date();
  let view = new Date(today);
  ov("Renungan harian", box => {
    const draw = () => {
      box.querySelectorAll(".pbody").forEach(n => n.remove());
      const body = el("div","pbody");
      const p = planFor(view);
      const key = planKey(view);
      const done = S.plan[key] || {};

      const nav = el("div","trow");
      const back = el("button","btn ghost","‹ Kemarin");
      back.onclick = () => { view.setDate(view.getDate()-1); draw(); };
      const now = el("button","btn ghost","Hari ini");
      now.onclick = () => { view = new Date(today); draw(); };
      const fwd = el("button","btn ghost","Besok ›");
      fwd.onclick = () => { view.setDate(view.getDate()+1); draw(); };
      nav.appendChild(back); nav.appendChild(now); nav.appendChild(fwd);
      body.appendChild(nav);

      const dd = view.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
      body.appendChild(el("p","hint", dd));

      const items = [
        ["Perjanjian Lama", p.ot, "ot"],
        ["Perjanjian Baru", p.nt, "nt"],
        ["Amsal", p.am, "am"],
      ];
      let allDone = true;
      items.forEach(([label,[bid,ch],slot]) => {
        const b = bk(bid);
        const r = el("button","res" + (done[slot] ? " on" : ""));
        const chk = el("span","chk" + (done[slot] ? " on" : ""), done[slot] ? "✓" : "");
        chk.onclick = ev => {
          ev.stopPropagation();
          const cur = S.plan[key] || {};
          if(cur[slot]) delete cur[slot]; else cur[slot] = true;
          if(Object.keys(cur).length) S.plan[key] = cur; else delete S.plan[key];
          persist(); draw();
        };
        r.appendChild(chk);
        const t = el("div","t");
        t.appendChild(el("b", null, `${b.name} ${ch}`));
        t.appendChild(el("i", null, `${label} · ${b.en} ${ch}`));
        r.appendChild(t);
        r.onclick = () => {
          S.book = bid; S.ch = ch; S.sel = null;
          persist(); closeOv(); render(); scrollTo(0,0);
        };
        body.appendChild(r);
        if(!done[slot]) allDone = false;
      });

      const streak = countStreak(today);
      body.appendChild(el("p","hint",
        (allDone ? "Selesai untuk hari ini. " : "") +
        (streak > 0 ? `Rentetan hari selesai: ${streak}.` : "Tandai bacaan yang sudah selesai dengan kotak centang.")));
      box.appendChild(body);
    };
    draw();
  });
}
function countStreak(from){
  let n = 0;
  const d = new Date(from);
  for(let i=0;i<400;i++){
    const k = planKey(d);
    const v = S.plan[k];
    if(v && v.ot && v.nt && v.am) n++;
    else if(i > 0) break;
    else if(!v) break;
    d.setDate(d.getDate()-1);
  }
  return n;
}

  // teks terjemahan kolom pertama. maxVFor menandai pasal mana yang
  // angkanya berlaku, supaya hasil pemuatan lama tidak dipakai keliru.

  ov("Buka kitab", box => {
    // dua gaya: papan angka (cepat) atau daftar kitab (menjelajah)
    const modes = el("div","tabs");

      const disp = el("div");
      disp.style.cssText = "display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 14px";
      const mkField = (label, val, which) => {

        w.appendChild(el("span", null, label)).style.cssText = "font-size:13px;color:var(--ink2)";

        n.style.cssText = "font-size:30px;font-weight:600;min-width:56px;text-align:center;padding:5px 8px;border-radius:50%;" +
          (field === which ? "border:2px solid var(--accent);color:var(--accent)" : "border:2px solid transparent;color:var(--ink)");

        w.onclick = () => { field = which; draw(); };

      };
      disp.appendChild(mkField("Pasal", chS, "ch"));
      disp.appendChild(mkField("Ayat", vsS, "vs"));
      wrapEl.appendChild(disp);

      const info = el("p","hint");
      info.style.textAlign = "center";
      wrapEl.appendChild(info);

      // muat jumlah ayat pasal ini sekali, lalu gambar ulang
      const chNum = +chS;
      const chValid = chS !== "" && chNum >= 1 && chNum <= b.ch;
      const want = chValid ? `${bid}.${chNum}` : "";
      if(want !== maxVFor){
        maxVFor = want; maxV = null;
        if(want){
          getCh(S.cols[0], bid, chNum).then(d => {
            if(maxVFor !== want) return;          // pasal sudah diganti
            if(d.ok && d.m.size) maxV = Math.max(...d.m.keys());
            draw();
          }).catch(() => {});
        }
      }
      // 176 = pasal terpanjang di Alkitab (Mazmur 119); dipakai sementara
      // selagi jumlah ayat pasal ini belum termuat
      const vcap = maxV || 176;
      info.textContent = !chValid
        ? `${b.name} — ${b.ch} pasal. Ayat boleh dikosongkan.`
        : maxV
          ? `${b.name} ${chNum} — ${maxV} ayat. Ayat boleh dikosongkan.`
          : `${b.name} — ${b.ch} pasal · menghitung jumlah ayat…`;

      // papan angka

      pad.style.cssText = "display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px";
      const cap = () => field === "ch" ? b.ch : vcap;

        const nx = (curS + d).replace(/^0+/,"");
        // nx kosong berarti menekan "0" pada kolom kosong — tidak
        // menghasilkan apa-apa, jadi tombolnya dimatikan saja daripada
        // terlihat aktif tapi diam
        return (nx !== "" && +nx <= cap()) ? nx : null;
      };
      const put = d => {
        const nx = tryNext(d);
        if(nx === null) return;                  // melewati batas — abaikan
        if(field === "ch"){ chS = nx; } else { vsS = nx; }
        draw();
      };
      for(let i=0;i<=9;i++){
        if(i === 0) continue;
        const k = el("button","chapbtn", i);
        k.style.cssText = "padding:16px 0;font-size:20px";
        if(tryNext(String(i)) === null){ k.disabled = true; k.style.opacity = ".3"; }
        k.onclick = () => put(String(i));
        pad.appendChild(k);
      }
      const del = el("button","chapbtn","⌫");
      del.style.cssText = "padding:16px 0;font-size:17px";
      del.onclick = () => { if(field === "ch") chS = chS.slice(0,-1); else vsS = vsS.slice(0,-1); draw(); };
      pad.appendChild(del);
      const z = el("button","chapbtn","0");
      z.style.cssText = "padding:16px 0;font-size:20px";
      if(tryNext("0") === null){ z.disabled = true; z.style.opacity = ".3"; }
      z.onclick = () => put("0");
      pad.appendChild(z);
      const ok = el("button","chapbtn","OK");
      ok.style.cssText = "padding:16px 0;font-size:16px;background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700";
      ok.onclick = () => {
        const c = Math.min(Math.max(+(chS || 1),1), b.ch);
        // ayat juga dijepit — kalau jumlah ayat sudah diketahui, tidak
        // mungkin lagi meminta ayat yang tidak ada di pasal itu
        let v = vsS ? +vsS : null;
        if(v != null) v = Math.min(Math.max(v,1), maxV || 176);
        jumpTo(bid, c, v, false);
      };
      pad.appendChild(ok);
      wrapEl.appendChild(pad);
    };
    draw();
  });
}

/* =========================================================
   CARI AYAT — pencarian teks
   Mencari di versi kolom pertama. Sumber pencarian:
   - bila versi sudah diunduh: seluruh Alkitab, langsung dari perangkat
   - bila belum: hanya pasal/kitab yang dipilih, diambil lewat jaringan
   Ini dibuat jujur di UI supaya tidak terkesan mencari seluruh Alkitab
   padahal cuma satu pasal.
   ========================================================= */
function norm(s){
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\p{L}\p{N}\s]/gu," ")
    .replace(/\s+/g," ").trim();
}
/* Semua kata pencarian harus cocok (AND), bukan salah satu saja.
   Tanpa ini, kueri seperti "xyz tidak ada" akan mengembalikan tiap ayat
   yang memuat kata umum "ada" — hasil yang menyesatkan.

   Pola regex disiapkan SEKALI per kueri (compileTerms) lalu dipakai
   ulang. Versi sebelumnya membangun RegExp baru untuk setiap kata di
   setiap ayat — pada terjemahan yang sudah diunduh (±31.000 ayat) itu
   berarti puluhan ribu regex per ketikan, dan pencarian terasa
   menggantung atau seperti tidak bekerja. */
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function compileTerms(terms){
  return terms.map(t => ({
    t,
    word: new RegExp("\\b" + reEsc(t) + "\\b"),
    stem: t.length >= 5 ? new RegExp("\\b" + reEsc(t.slice(0, t.length - 2))) : null
  }));
}
function scoreHay(hay, cterms){
  let sc = 0;
  for(const c of cterms){
    if(hay.includes(c.t)){
      sc += c.t.length * 3;
      if(c.word.test(hay)) sc += 6;
    }else if(c.stem){
      // kata panjang boleh cocok sebagian (imbuhan), kata pendek tidak
      if(c.stem.test(hay)) sc += c.t.length;
      else return 0;
    }else return 0;
  }
  return sc;
}

/* ---------- indeks pencarian ----------
   Teks yang sudah dinormalkan disimpan sekali per terjemahan. Dulu
   norm() dijalankan untuk setiap ayat pada setiap ketikan; untuk satu
   Alkitab penuh itu ±31.000 pemanggilan NFD + tiga regex — cukup lama
   sampai terasa macet. Sekarang biaya itu dibayar satu kali saja. */
const NORM_IDX = new Map();   // id versi -> [{b, ch, v, text, hay}]
async function normIndex(vid){
  if(NORM_IDX.has(vid)) return NORM_IDX.get(vid);
  const off = await offlineLoad(vid);
  if(!off) return null;
  const arr = [];
  for(const [key,text] of off){
    const p = key.split(".");
    const chN = +p[1], vnN = +p[2];
    if(!Number.isFinite(chN) || !Number.isFinite(vnN)) continue;
    const b = bk(p[0]); if(!b) continue;
    arr.push({b, ch:chN, v:vnN, text, hay:norm(text)});
  }
  NORM_IDX.set(vid, arr);
  return arr;
}

/* ---------- kenali referensi ayat dari teks pencarian ----------
   Contoh yang dikenali: "kejadian 10:10", "kej 10 10", "yohanes 3.16",
   "1 samuel 10" (tanpa ayat — cuma lompat ke pasalnya). Titik dua/titik/
   spasi semua dianggap sama karena norm() sudah meratakannya jadi spasi.
   Butuh MINIMAL nama kitab yang cocok + nomor pasal yang valid untuk
   kitab itu; kalau tidak yakin, kembalikan null supaya tetap jatuh ke
   pencarian kata biasa (fitur ini murni tambahan, tidak menggantikan). */
function parseRef(raw){
  let toks = norm(raw).split(" ").filter(t => t && t !== "pasal" && t !== "psl" && t !== "ayat" && t !== "ay");
  if(!toks.length) return null;
  const nums = [];
  while(toks.length && nums.length < 2 && /^\d+$/.test(toks[toks.length-1])) nums.unshift(+toks.pop());
  if(!nums.length) return null;
  const ch = nums[0], verse = nums.length > 1 ? nums[1] : null;
  const namePart = toks.join(" ");
  if(!namePart) return null;

  const names = b => [norm(b.name), norm(b.en)];
  const book =
    BOOKS.find(b => b.id === namePart || names(b).includes(namePart)) ||
    BOOKS.find(b => names(b).some(nm => nm.startsWith(namePart))) ||
    (namePart.length >= 3 ? BOOKS.find(b => names(b).some(nm => nm.includes(namePart))) : null);
  if(!book || !Number.isFinite(ch) || ch < 1 || ch > book.ch) return null;
  return {book, ch, verse: (verse && verse >= 1) ? verse : null};
}

/* ---------- lompat ke sebuah ayat ----------
   Dipakai pencarian kata (S.sel, tanpa tanda tetap) dan lompat-referensi +
   daftar catatan. mark=true menandai ayat itu dengan SOROT warna aktif
   alih-alih sekadar menyorotnya sementara lewat S.sel. */
function jumpTo(bookId, ch, verse, mark){
  S.book = bookId; S.ch = ch;
  S.sel = verse || null;                       // selalu ditandai supaya kelihatan
  if(mark && verse) S.mark[vkey(verse)] = S.sorotColor;
  persist(); closeOv();
  // render() asinkron (menunggu teks pasal), jadi menggulir HARUS sesudah
  // barisnya benar-benar ada di halaman — kalau tidak, gulir tidak terjadi
  // dan pengguna harus mencari sendiri ayatnya.
  render().then(() => scrollToVerse(verse));
}

/* Gulir ke satu ayat dan kedipkan sebentar supaya mata langsung menemukannya.
   Topbar-nya sticky, jadi dipakai block:"center" — bukan scrollIntoView biasa
   yang bisa menaruh ayat tepat di balik topbar. */
function scrollToVerse(n){
  if(!n){ scrollTo(0,0); return; }
  const row = document.querySelector(`.vrow[data-v="${n}"]`);
  if(!row){ scrollTo(0,0); return; }
  try{ row.scrollIntoView({behavior:"smooth", block:"center"}); }
  catch{ row.scrollIntoView(); }
  row.classList.remove("flash");
  void row.offsetWidth;                        // paksa ulang animasi
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 1300);
}

    const status = el("p","hint","");
    box.appendChild(status);
    const out = el("div");
    box.appendChild(out);

    let downloaded = false;
    function loadDownloadedFlag(){
      offlineLoad(vid).then(m => { downloaded = !!m; drawScope(); });
    }
    loadDownloadedFlag();

    function drawVerRow(){
      verRow.innerHTML = "";
      Object.keys(VER).forEach(id => {
        const vv = VER[id];
        const b = el("button","pill" + (id === vid ? " on" : ""));
        b.appendChild(el("span", null, vv.abbr || id));
        b.onclick = () => {
          if(id === vid) return;
          vid = id;
          downloaded = false;
          loadDownloadedFlag();
          drawVerRow(); drawScope(); run();
        };
        verRow.appendChild(b);
      });
    }

    function drawScope(){
      scopeBox.innerHTML = "";
      const opts = [
        ["ot","Perjanjian Lama"],
        ["nt","Perjanjian Baru"],
        ["book","Kitab ini (" + cur().name + ")"],
        ["chapter","Pasal ini"],
      ];
      opts.forEach(([k,label]) => {
        const b = el("button","pill" + (scope[k] ? " on" : ""));
        b.appendChild(el("span", null, (scope[k] ? "✓ " : "") + label));
        b.onclick = () => {
          scope[k] = !scope[k];
          // "pasal ini" dan "kitab ini" mempersempit; PL/PB jadi tak relevan
          if(k === "chapter" && scope.chapter){ scope.book = false; }
          if(k === "book" && scope.book){ scope.chapter = false; }
          drawScope(); run();
        };
        scopeBox.appendChild(b);
      });
      const abbr = (VER[vid] && VER[vid].abbr) || vid;
      if(VER[vid] && VER[vid].api){
        status.textContent = `Mencari di ${abbr} lewat API penerbit — satu pasal = satu permintaan, jadi pilih "Pasal ini" saja supaya kuota API tidak cepat habis.`;
        return;
      }
      status.textContent = downloaded
        ? `Mencari di ${abbr} — sudah diunduh, seluruh Alkitab bisa dicari.`
        : `Mencari di ${abbr} — belum diunduh, jadi hanya pasal/kitab yang dipilih yang dicari lewat jaringan. Unduh versi ini lewat ⬇ untuk mencari seluruh Alkitab.`;
    }

    let timer = null;
    q.oninput = () => { clearTimeout(timer); timer = setTimeout(run, 260); };
    q.addEventListener("keydown", e => {
      if(e.key !== "Enter") return;
      e.preventDefault();
      const ref = parseRef(q.value.trim());
      if(ref) jumpTo(ref.book.id, ref.ch, ref.verse, true);
      else{ clearTimeout(timer); run(); }
    });

    function refCard(ref){
      const r = el("div","res rowbox");
      const t = el("div","t tap");
      t.appendChild(el("b", null, `→ ${ref.book.name} ${ref.ch}${ref.verse ? ":" + ref.verse : ""}`));
      t.appendChild(el("i", null, "Buka ayat ini dan tandai stabilo — atau tekan Enter"));
      t.onclick = () => jumpTo(ref.book.id, ref.ch, ref.verse, true);
      r.appendChild(t);
      return r;
    }

    function hitRow(h){
      const r = el("div","res rowbox");
      const t = el("div","t tap");
      t.appendChild(el("b", null, `${h.b.name} ${h.ch}:${h.v}`));
      const snippet = h.text.length > 120 ? h.text.slice(0,118) + "…" : h.text;
      t.appendChild(el("i", null, snippet));
      t.onclick = () => jumpTo(h.b.id, h.ch, h.v, false);
      r.appendChild(t);
      return r;
    }

    async function run(){
      const my = ++seq;                    // kueri ini; kalau ada yang lebih baru, berhenti
      const alive = () => my === seq;
      const raw = q.value.trim();
      out.innerHTML = "";
      if(raw.length < 2) return;

      // Referensi ayat ditawarkan DI ATAS, tapi pencarian kata tetap
      // dijalankan di bawahnya — dulu fungsi langsung berhenti di sini,
      // sehingga kueri seperti "mazmur 23" tidak bisa dicari sebagai kata.
      const ref = parseRef(raw);
      if(ref) out.appendChild(refCard(ref));

      const terms = norm(raw).split(" ").filter(t => t.length > 1);
      if(!terms.length){
        if(!ref) out.appendChild(el("p","hint","Ketik minimal satu kata yang lebih dari satu huruf."));
        return;
      }
      const cterms = compileTerms(terms);

      const anyScope = scope.chapter || scope.book || scope.ot || scope.nt;
      if(!anyScope){
        out.appendChild(el("p","hint","Tidak ada cakupan yang dipilih. Nyalakan Perjanjian Lama, Perjanjian Baru, kitab ini, atau pasal ini."));
        return;
      }

      const prog = el("p","hint","Mencari…");
      out.appendChild(prog);
      const hits = [];
      let capped = false, missingBook = false, netFail = 0;

      const idx = await normIndex(vid);
      if(!alive()) return;

      if(idx){
        for(const e of idx){
          if(scope.chapter && !(e.b.id === S.book && e.ch === S.ch)) continue;
          if(!scope.chapter && scope.book && e.b.id !== S.book) continue;
          if(!scope.chapter && !scope.book){
            if(e.b.t === "PL" && !scope.ot) continue;
            if(e.b.t === "PB" && !scope.nt) continue;
          }
          const sc = scoreHay(e.hay, cterms);
          if(sc > 0) hits.push({b:e.b, ch:e.ch, v:e.v, text:e.text, sc});
        }
      }else{
        // Belum diunduh: ambil lewat jaringan. Dulu pasal diambil satu per
        // satu secara berurutan — untuk satu kitab besar itu puluhan
        // permintaan berantai dan terasa seperti macet. Sekarang enam
        // sekaligus, dengan penunjuk kemajuan dan bisa dibatalkan kueri baru.
        const targets = [];
        if(scope.chapter || !scope.book) targets.push([S.book, S.ch]);
        if(scope.book && !scope.chapter){
          const b = cur();
          for(let c=1;c<=b.ch;c++) targets.push([b.id,c]);
        }
        const LIMIT = 60;
        if(targets.length > LIMIT) capped = true;
        const list = targets.slice(0, LIMIT);
        const BATCH = 6;
        for(let i=0;i<list.length;i+=BATCH){
          if(!alive()) return;
          prog.textContent = `Mencari… ${Math.min(i+BATCH, list.length)}/${list.length} pasal`;
          const part = await Promise.all(
            list.slice(i, i+BATCH).map(([bid,ch]) => getCh(vid, bid, ch).then(d => [bid, ch, d]))
          );
          if(!alive()) return;
          for(const [bid,ch,d] of part){
            if(!d.ok){ if(d.missing) missingBook = true; else netFail++; continue; }
            for(const [n,text] of d.m){
              const sc = scoreHay(norm(text), cterms);
              if(sc > 0) hits.push({b:bk(bid), ch, v:n, text, sc});
            }
          }
        }
      }

      if(!alive()) return;
      out.innerHTML = "";
      if(ref) out.appendChild(refCard(ref));

      if(!hits.length){
        if(missingBook && !netFail){
          out.appendChild(el("p","hint", `${cur().name} tidak ada dalam ${(VER[vid] && VER[vid].abbr) || vid}. Pilih terjemahan lain di atas.`));
        }else if(netFail){
          out.appendChild(el("p","hint","Sebagian teks gagal diambil — periksa koneksi lalu coba lagi."));
        }else{
          out.appendChild(el("p","hint","Tidak ditemukan. Coba kata lain, atau perluas cakupan."));
        }
        return;
      }

      hits.sort((a,b) => b.sc - a.sc || BOOKS.indexOf(a.b) - BOOKS.indexOf(b.b) || a.ch - b.ch || a.v - b.v);
      const shown = Math.min(40, hits.length);
      out.appendChild(el("div","sechead", hits.length > shown ? `${hits.length} hasil — ${shown} teratas` : `${hits.length} hasil`));
      hits.slice(0, shown).forEach(h => out.appendChild(hitRow(h)));
      if(capped) out.appendChild(el("p","hint", `Kitab ini lebih dari 60 pasal, jadi hanya 60 pasal pertama yang dicari lewat jaringan. Unduh ${(VER[vid] && VER[vid].abbr) || vid} lewat ⬇ untuk mencari semuanya.`));
      if(netFail) out.appendChild(el("p","hint", `${netFail} pasal gagal diambil, jadi hasilnya mungkin belum lengkap.`));
    }

    drawVerRow();
    drawScope();
    setTimeout(() => q.focus(), 120);
  });
}

</script>
</body>
</html>
